name: Apply Portfolio History V2 Integration

on:
  push:
    branches: [fix/history-dark-mode-feedback]
    paths:
      - "scripts/apply-portfolio-history-v2-integration.mjs"
      - ".github/workflows/apply-portfolio-history-v2-integration.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/history-dark-mode-feedback
          fetch-depth: 0
      - name: Apply deterministic integration
        run: node scripts/apply-portfolio-history-v2-integration.mjs
      - name: Commit generated source and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-portfolio-history-v2-integration.mjs .github/workflows/apply-portfolio-history-v2-integration.yml
          git add src/app/carteira/page.tsx
          git commit -m "feat: integra histórico v2 aos gráficos e indicadores"
          git push origin HEAD:fix/history-dark-mode-feedback
