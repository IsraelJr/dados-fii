name: Cancel Duplicate Frozen Collector

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cancel-duplicate-frozen-collector.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel duplicate pending collector
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/29892229523/cancel"
