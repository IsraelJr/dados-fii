name: Create KNSC11 docs PR

on:
  push:
    branches:
      - docs-knsc11-v680

permissions:
  contents: write
  pull-requests: write

jobs:
  create-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request and remove bootstrap workflow
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = "docs-knsc11-v680";
            const base = "main";
            const path = ".github/workflows/create-knsc-docs-pr.yml";

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${head}`,
              base,
            });

            if (existing.data.length === 0) {
              await github.rest.pulls.create({
                owner,
                repo,
                title: "docs: registra conclusão canônica do KNSC11",
                body: [
                  "## Atualização canônica v6.8.0",
                  "",
                  "Formaliza o KNSC11 após o merge e a auditoria da PR funcional #118.",
                  "",
                  "- 52/52 documentos classificados;",
                  "- 48 competências contínuas;",
                  "- zero pendências, conflitos e lacunas;",
                  "- MCCI11 como próxima unidade, ainda não iniciada;",
                  "- política de deployment aplicável protegida por teste.",
                  "",
                  "A issue #117 permanece aberta até merge e auditoria desta PR.",
                ].join("\n"),
                head,
                base,
                maintainer_can_modify: true,
              });
            }

            const workflow = await github.rest.repos.getContent({
              owner,
              repo,
              path,
              ref: head,
            });

            await github.rest.repos.deleteFile({
              owner,
              repo,
              path,
              message: "chore: remove bootstrap temporário da PR documental",
              sha: workflow.data.sha,
              branch: head,
            });
