name: Dispatch Frozen Collector Now

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-frozen-collector-now.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch frozen dividend collector on current main
        run: gh workflow run risk-lab-frozen-dividend-notices.yml --repo "$GITHUB_REPOSITORY" --ref main
