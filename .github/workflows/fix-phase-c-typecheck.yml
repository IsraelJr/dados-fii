name: Fix Phase 3.5-C Typecheck

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fix-phase-c-typecheck.yml"
      - "src/lib/risk-lab/FrozenCohortPhaseC.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/sprint-3-5-c-dataset-backtest' || github.ref_name == 'agent/sprint-3-5-c-dataset-backtest'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sprint-3-5-c-dataset-backtest
          fetch-depth: 0
      - name: Apply exact type-safe hash projection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/risk-lab/FrozenCohortPhaseC.ts')
          text = path.read_text()
          old = '  const indexPayload = { ...index };\n  delete indexPayload.evidenceHash;\n'
          new = '  const { evidenceHash: _ignoredEvidenceHash, ...indexPayload } = index;\n'
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('Trecho esperado para correção do typecheck não foi encontrado.')
          if text.count(old) != 1:
              raise SystemExit(f'Esperada uma ocorrência; encontradas {text.count(old)}.')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit source-only correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/risk-lab/FrozenCohortPhaseC.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: torna projeção do evidenceHash compatível com TypeScript"
          git push origin HEAD:agent/sprint-3-5-c-dataset-backtest
