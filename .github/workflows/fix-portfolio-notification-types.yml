name: Fix Portfolio Notification Types

on:
  push:
    branches:
      - feature/portfolio-notifications

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/portfolio-notifications
          fetch-depth: 0
      - name: Apply targeted type fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/portfolioNotificationEngine.ts')
          text = path.read_text()
          old = '    const snap = await transaction.get(ref);'
          new = '    const snap: any = await transaction.get(ref);'
          if old not in text:
              raise SystemExit(0)
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/portfolioNotificationEngine.ts
          git commit -m "Fix notification transaction snapshot typing"
          git push origin HEAD:feature/portfolio-notifications
