name: Publish Handoff v6.9.0

on:
  push:
    branches: [docs/handoff-v6-9-0-mcci11]
    paths:
      - ".github/workflows/handoff-v690-bootstrap.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/handoff-v6-9-0-mcci11
          fetch-depth: 0

      - name: Restore audited Handoff
        shell: bash
        run: |
          cat > /tmp/handoff.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/handoff.gz.b64 | gzip -d > DADOS_FII_HANDOFF.md

      - name: Commit Handoff and remove bootstrap
        run: |
          rm .github/workflows/handoff-v690-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DADOS_FII_HANDOFF.md .github/workflows/handoff-v690-bootstrap.yml
          git commit -m "docs: atualiza Handoff para v6.9.0"
          git push origin HEAD:docs/handoff-v6-9-0-mcci11
