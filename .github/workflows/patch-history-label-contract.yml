name: Patch history label contract

on:
  push:
    branches:
      - fix/history-source-sync

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[history-labels-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/history-source-sync
      - name: Preserve existing metric labels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/carteira/page.tsx')
          text = path.read_text()
          text = text.replace('label={`Total em ${historicalStats.currentYear}`}', 'label="Total no ano"')
          text = text.replace('label={`Média mensal em ${historicalStats.currentYear}`}', 'label="Média mensal"')
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/carteira/page.tsx
          git commit -m "fix: preserva rótulos dos indicadores [history-labels-patched]"
          git push origin HEAD:fix/history-source-sync
