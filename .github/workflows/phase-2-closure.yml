name: Phase 2 Closure CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/phase-2-closure.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/phase-2-closure.yml"

permissions:
  contents: read

concurrency:
  group: phase-2-closure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --silent
      - name: Typecheck
        run: npm run typecheck
      - name: Sprint 2 regression suite
        run: npm run test:sprint2
      - name: Risk Lab regression suite
        run: npm run test:risk-lab
