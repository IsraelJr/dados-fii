name: Phase 2 Closure CI

# O nome do check é preservado para não quebrar regras de proteção existentes.
# A finalidade atual é a CI central rápida do projeto.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/**"
      - "DADOS_FII_HANDOFF.md"
      - "docs/strategy/**"
      - "docs/sources/premium-prompt/**"
      - "docs/engineering/github-actions-*.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - "DADOS_FII_HANDOFF.md"
      - "docs/strategy/**"
      - "docs/sources/premium-prompt/**"
      - "tests/github-actions-governance.test.mjs"
      - "tests/canonical-handoff.test.mjs"
      - "docs/engineering/github-actions-*.md"

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frozen dependencies
        run: npm ci --silent

      - name: Validate GitHub Actions governance
        run: npm run test:workflow-governance

      - name: Validate canonical Handoff
        run: npm run test:handoff

      - name: Typecheck
        if: github.event_name == 'pull_request'
        run: npm run typecheck

      - name: Sprint 2 regression suite
        if: github.event_name == 'pull_request'
        run: npm run test:sprint2
