name: Phase 1 Live Smoke Once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/phase1-live-smoke.trigger"

permissions:
  contents: read

jobs:
  preview-live-smoke:
    name: Preview live ingestion smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    env:
      E2E_BASE_URL: https://dados-fii-git-agent-tgar1-0d0256-israel-alves-projects-aee7aa56.vercel.app
      E2E_ADMIN_UPDATE_SECRET: ${{ secrets.E2E_ADMIN_UPDATE_SECRET }}
      E2E_VERCEL_BYPASS_TOKEN: ${{ secrets.E2E_VERCEL_BYPASS_TOKEN }}
      E2E_RUN_LIVE_INGESTION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --silent
      - run: npx playwright install --with-deps chromium
      - name: Validate Preview security and admin session
        run: npm run test:phase1:security
      - name: Run controlled MXRF11 staging ingestion smoke
        run: npm run test:phase1:operational
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-preview-live-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30
