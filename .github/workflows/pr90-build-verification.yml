name: PR 90 Build Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr90-build-verification.yml
      - src/lib/risk-lab/FnetDividendNoticeParser.ts
      - src/lib/risk-lab/FrozenDividendNoticeCollector.ts
      - tests/risk-lab-frozen-dividend-parser.test.ts
      - tests/risk-lab-frozen-dividend-collector.test.ts

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with diagnostic capture
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/next-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr90-next-build-diagnostics
          path: /tmp/next-build.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce build
        if: steps.build.outcome != 'success'
        run: exit 1
