name: Production Premium Smoke

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "SHA completo já ativo em Produção"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-premium-smoke-${{ inputs.release_sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PRODUCTION_ORIGIN: https://dadosfii.com.br
      RELEASE_COMMIT: ${{ inputs.release_sha }}
    steps:
      - name: Validate release identifier
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]

      - name: Obtain scoped GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error --fail-with-body \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dados-fii-production-smoke")
          token=$(jq -er '.value' <<< "$response")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Generate and verify real Premium report
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          http_code=$(curl --silent --show-error --location --max-time 300 \
            --output premium-production-smoke.json --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            "${PRODUCTION_ORIGIN}/api/internal/production-premium-smoke")
          if [[ "$http_code" != "200" ]]; then
            jq '{ok, evidence: {status: .evidence.status, blocker: .evidence.blocker, checks: .evidence.checks}}' premium-production-smoke.json || true
            exit 1
          fi
          jq -e --arg release "$RELEASE_COMMIT" '
            .ok == true
            and .evidence.status == "passed"
            and .evidence.releaseCommit == $release
            and (.evidence.checks | length) >= 4
            and ([.evidence.checks[] | select(.status != "passed")] | length) == 0
            and (.evidence.auditEventId | length) > 7
            and (.evidence.evidenceHash | test("^[a-f0-9]{64}$"))
          ' premium-production-smoke.json >/dev/null

      - name: Publish sanitized summary
        if: always()
        shell: bash
        run: |
          if [[ -f premium-production-smoke.json ]]; then
            {
              echo "## Premium production smoke"
              echo "- Release: \`$(jq -r '.evidence.releaseCommit // "unknown"' premium-production-smoke.json)\`"
              echo "- Status: \`$(jq -r '.evidence.status // "unknown"' premium-production-smoke.json)\`"
              echo "- Evidence: \`$(jq -r '.evidence.evidenceHash // "unknown"' premium-production-smoke.json)\`"
              echo "- Audit event: \`$(jq -r '.evidence.auditEventId // "none"' premium-production-smoke.json)\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-production-smoke-${{ inputs.release_sha }}
          path: premium-production-smoke.json
          if-no-files-found: error
          retention-days: 7
