name: Production Premium Smoke

on:
  status:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "SHA completo já ativo em Produção"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: production-premium-smoke-${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.event.sha }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.context == 'Vercel' &&
        github.event.state == 'success' &&
        contains(github.event.branches.*.name, 'main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PRODUCTION_ORIGIN: https://www.dadosfii.com.br
      RELEASE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.event.sha }}
    steps:
      - name: Validate release identifier
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]

      - name: Obtain scoped GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error --fail-with-body \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dados-fii-production-smoke")
          token=$(jq -er '.value' <<< "$response")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Generate and verify real Premium report
        id: smoke
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          http_code=$(curl --silent --show-error --max-time 300 \
            --output premium-production-smoke.json --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            "${PRODUCTION_ORIGIN}/api/internal/production-premium-smoke")
          if [[ "$http_code" != "200" ]]; then
            jq '{ok, error, evidence: {status: .evidence.status, blocker: .evidence.blocker, checks: .evidence.checks}}' premium-production-smoke.json || true
            exit 1
          fi
          jq -e --arg release "$RELEASE_COMMIT" '
            .ok == true
            and .evidence.status == "passed"
            and .evidence.releaseCommit == $release
            and (.evidence.checks | length) >= 4
            and ([.evidence.checks[] | select(.status != "passed")] | length) == 0
            and (.evidence.auditEventId | length) > 7
            and (.evidence.evidenceHash | test("^[a-f0-9]{64}$"))
          ' premium-production-smoke.json >/dev/null

      - name: Publish auditable commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.RELEASE_COMMIT }}
          SMOKE_STATE: ${{ steps.smoke.outcome == 'success' && 'success' || 'failure' }}
          SMOKE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(jq -nc \
            --arg state "${SMOKE_STATE}" \
            --arg context "Production Premium Smoke" \
            --arg description "Premium real, auditoria persistida e isolamento read-only" \
            --arg target_url "${SMOKE_URL}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "${payload}"

      - name: Publish sanitized summary
        if: always()
        shell: bash
        run: |
          if [[ -f premium-production-smoke.json ]]; then
            {
              echo "## Premium production smoke"
              echo "- Release: \`$(jq -r '.evidence.releaseCommit // "unknown"' premium-production-smoke.json)\`"
              echo "- Status: \`$(jq -r '.evidence.status // "unknown"' premium-production-smoke.json)\`"
              echo "- Evidence: \`$(jq -r '.evidence.evidenceHash // "unknown"' premium-production-smoke.json)\`"
              echo "- Audit event: \`$(jq -r '.evidence.auditEventId // "none"' premium-production-smoke.json)\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-production-smoke-${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.event.sha }}
          path: premium-production-smoke.json
          if-no-files-found: error
          retention-days: 7
