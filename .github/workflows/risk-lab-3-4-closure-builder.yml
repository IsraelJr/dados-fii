name: Risk Lab 3.4 Formal Closure Builder

on:
  push:
    branches:
      - agent/risk-lab-3-4-formal-closure
    paths:
      - ".github/workflows/risk-lab-3-4-closure-builder.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: risk-lab-3-4-formal-closure
  cancel-in-progress: false

jobs:
  build-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: agent/risk-lab-3-4-formal-closure
          fetch-depth: 0

      - name: Materialize approved evidence and closure changes
        shell: bash
        run: |
          set -euo pipefail
          result_branch="automation/risk-lab-3-4-result-0072ecf340e6"
          evidence_path="docs/production-evidence/risk-lab/risk-lab-3-4-20260720-v1.json"

          git fetch origin "$result_branch"
          mkdir -p "$(dirname "$evidence_path")"
          git show "origin/${result_branch}:${evidence_path}" > "$evidence_path"
          jq -e '.status == "passed" and .sprint == "3.4" and (.evidenceHash | length == 64) and (.blockers | length == 0)' "$evidence_path" >/dev/null

          cat > src/app/api/system/risk-lab-production-smoke/route.ts <<'EOF'
          import { NextResponse } from "next/server";
          import { riskLabProductionSmokeService } from "@/lib/risk-lab/RiskLabProductionSmokeService";

          export const runtime = "nodejs";
          export const dynamic = "force-dynamic";

          function response(payload: unknown, status = 200) {
            return NextResponse.json(payload, {
              status,
              headers: {
                "Cache-Control": "no-store",
                "Pragma": "no-cache",
                "X-Robots-Tag": "noindex, nofollow",
                "X-Content-Type-Options": "nosniff",
              },
            });
          }

          export async function GET() {
            try {
              const evidence = await riskLabProductionSmokeService.getPublicEvidence();
              return response({
                ok: evidence?.status === "passed",
                sprint: "3.4",
                status: evidence?.status || "pending",
                evidence,
              });
            } catch (error) {
              console.error("Risk Lab production smoke evidence error", error instanceof Error ? error.message : "unknown");
              return response({ ok: false, sprint: "3.4", status: "unavailable" }, 503);
            }
          }
          EOF

          cat > tests/risk-lab-production-smoke-architecture.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { existsSync, readFileSync } from "node:fs";
          import test from "node:test";

          const smokeService = readFileSync("src/lib/risk-lab/RiskLabProductionSmokeService.ts", "utf8");
          const smokeStore = readFileSync("src/lib/risk-lab/RiskLabProductionSmokeStore.ts", "utf8");
          const scanStore = readFileSync("src/lib/risk-lab/RiskLabAutomaticScanStore.ts", "utf8");
          const smokeRoute = readFileSync("src/app/api/system/risk-lab-production-smoke/route.ts", "utf8");
          const adminRoute = readFileSync("src/app/api/admin/system/risk-lab/automatic/route.ts", "utf8");
          const evidence = JSON.parse(readFileSync("docs/production-evidence/risk-lab/risk-lab-3-4-20260720-v1.json", "utf8"));

          function executable(source) {
            return source
              .replace(/\/\*[\s\S]*?\*\//g, "")
              .replace(/^\s*\/\/.*$/gm, "");
          }

          test("production smoke covers the official Sprint 3.4 matrix", () => {
            for (const value of ["HCTR11", "MCCI11", "RBRY11", "invalid-ticker", "insufficient-series", "ambiguous-credit-event"]) {
              assert.match(smokeService, new RegExp(value));
            }
            for (const checkId of ["deployment.production", "feature.automatic-discovery", "rate-limit.contract", "persistence.scans", "audit.scans", "isolation.external-effects", "integrity.scan-hashes"]) {
              assert.match(smokeService, new RegExp(checkId.replaceAll(".", "\\.")));
            }
          });

          test("automatic scans and smoke evidence use repositories with locks and audit", () => {
            assert.match(scanStore, /RiskLabAutomaticScans/);
            assert.match(scanStore, /RiskLabAutomaticScanAudit/);
            assert.match(scanStore, /runTransaction/);
            assert.match(smokeStore, /RiskLabProductionSmokeRuns/);
            assert.match(smokeStore, /RiskLabProductionSmokeAudit/);
            assert.match(smokeStore, /RiskLabProductionSmokeLocks/);
            assert.match(smokeStore, /acquireLock/);
            assert.match(smokeStore, /releaseLock/);
            assert.match(adminRoute, /repository:\s*riskLabAutomaticScanStore/);
          });

          test("production evidence route is permanently read-only after closure", () => {
            assert.match(smokeRoute, /export async function GET\(\)/);
            assert.match(smokeRoute, /getPublicEvidence/);
            assert.doesNotMatch(smokeRoute, /NextRequest|searchParams|run\(\)|VERCEL_GIT_COMMIT_SHA|github-actions|AUTOMATIC_TRIGGER|TOKEN/);
            assert.equal(existsSync(".github/workflows/risk-lab-production-smoke.yml"), false);
          });

          test("approved production evidence is immutable and complete", () => {
            assert.equal(evidence.status, "passed");
            assert.equal(evidence.sprint, "3.4");
            assert.equal(evidence.checks.length, 11);
            assert.equal(evidence.cases.length, 6);
            assert.equal(evidence.blockers.length, 0);
            assert.match(evidence.evidenceHash, /^[a-f0-9]{64}$/);
            assert.equal(evidence.cases.every((item) => item.premiumIntegrated === false && item.notificationsSent === false), true);
          });

          test("smoke remains isolated from Premium and notifications", () => {
            const source = executable(smokeService);
            assert.doesNotMatch(source, /getPremiumReport|AIInsights|sendEmail|sendNotification|createAlert/);
            assert.match(source, /premiumIntegrated:\s*false/);
            assert.match(source, /notificationsSent:\s*false/);
            assert.match(adminRoute, /RISK_LAB_AUTOMATIC_RATE_LIMIT/);
          });
          EOF

          cat >> docs/risk-lab/sprint-3-4-production-smoke.md <<'EOF'

          ## Resultado de Produção

          - Status: `passed`;
          - run: `risk-lab-3-4-20260720-v1`;
          - commit auditado: `e9a5d6ec263c0aa87961133a361891f60175dba4`;
          - ambiente: `production`;
          - deployment: `https://www.dadosfii.com.br`;
          - checks: `11/11`;
          - casos: `6/6`;
          - hash: `deb0f79597c2fbfb87214c6d05df37cbe782e084e4a7289a487042c3582a567f`;
          - Premium integrado: `false`;
          - notificações enviadas: `false`.

          Os três casos reais (`HCTR11`, `MCCI11` e `RBRY11`) terminaram como `inconclusive`, sem falsa classificação final, porque as fontes consultadas não produziram evidência estruturada suficiente. Isso aprova a segurança operacional e a semântica do pipeline, mas não substitui a verificação primária e o backtest da Sprint 3.5.
          EOF

          python <<'PY'
          import re
          from pathlib import Path

          path = Path("DADOS_FII_HANDOFF.md")
          text = path.read_text()

          replacements = {
              "**Versão:** 6.1.0": "**Versão:** 6.2.0",
              "**Commit auditado em Produção:** `f4602e223e04c2d917b22a19391dbbd9e6f6286b`": "**Commit auditado em Produção:** `e9a5d6ec263c0aa87961133a361891f60175dba4`",
              "**Branch desta atualização:** `agent/phase-2-formal-closure`": "**Branch desta atualização:** `agent/risk-lab-3-4-formal-closure`",
              "**PR desta atualização:** #50 — `chore: formaliza encerramento auditável da Fase 2`": "**PR desta atualização:** #PENDING — `chore: formaliza conclusão da Sprint 3.4`",
              "| Sprint corrente canônica: **3.4 — Risk Lab em Produção e smoke ponta a ponta**. | Sprint 2.12 como sprint corrente. | A Sprint 2.12 foi concluída; a próxima pendência operacional é homologar o Risk Lab sem integrá-lo ainda ao Premium ou às notificações. |": "| Sprint corrente canônica: **3.5 — Coorte externa e backtest sem informação futura**. | Sprint 3.4 como sprint corrente. | A Sprint 3.4 foi homologada em Produção com evidência auditável, mantendo o Risk Lab isolado do Premium e das notificações. |",
              "- O Risk Lab está implementado em código até a PR #41, mas continua isolado do Premium e das notificações. A coorte externa permanece bloqueada até verificação primária.": "- A Sprint 3.4 do Risk Lab foi concluída em Produção com 11/11 checks e 6/6 casos, evidência `deb0f79597c2fbfb87214c6d05df37cbe782e084e4a7289a487042c3582a567f`. O Risk Lab continua isolado do Premium e das notificações; a coorte externa permanece bloqueada até verificação primária.",
              "| Fase 3 — Risk Lab | Sim, até 3.3 | Sim | Deployment geral verde | Smoke autenticado e coorte ausentes | Em andamento |": "| Fase 3 — Risk Lab | Sim, até 3.4 | Sim | Sim (`e9a5d6e`, Vercel verde) | Smoke 3.4: 11/11 checks e 6/6 casos; coorte externa pendente | Em andamento |",
              "**Em andamento.** As Sprints 3.0 a 3.3 possuem código e testes. A Sprint 3.4 precisa executar o smoke autenticado; a 3.5 está bloqueada até verificação primária da coorte.": "**Em andamento.** As Sprints 3.0 a 3.4 possuem código, testes e homologação de Produção. A Sprint 3.5 continua bloqueada até a verificação primária da coorte externa.",
              "### Sprint 3.4 — Risk Lab em Produção": "### Sprint 3.4 — Risk Lab em Produção (concluída)",
              "**Aceite:** deployment `Ready`; flags explicitamente conferidas; Admin autenticado e ticker-only; casos `HCTR11`, `MCCI11`, `RBRY11`, ticker inválido, insuficiência e ambiguidade; persistência/auditoria conferidas; zero efeito no Premium e nas notificações; smoke salvo no Git.": "**Aceite obtido:** deployment de Produção identificado; 11/11 checks; 6/6 casos; persistência, auditoria, locks, hashes e rate limit conferidos; zero efeito no Premium e nas notificações; evidência `deb0f79597c2fbfb87214c6d05df37cbe782e084e4a7289a487042c3582a567f` salva no Git. Os casos reais ficaram inconclusivos com segurança por insuficiência de evidência estruturada, sem falsa classificação final.",
              "1. Executar o smoke autenticado da Sprint 3.4 no commit de release do Risk Lab.\n2. Verificar fontes primárias da coorte e só então remover o bloqueio de execução.": "1. Verificar fontes primárias da coorte e só então remover o bloqueio de execução.",
              "Formulação vigente: **Fases 1 e 2 formalmente concluídas em Produção sob a evidência schema v2; Fase 3 em andamento, com Sprint atual 3.4.**": "Formulação vigente: **Fases 1 e 2 formalmente concluídas em Produção sob a evidência schema v2; Fase 3 em andamento, com Sprint 3.4 concluída e Sprint atual 3.5.**",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Handoff marker not found: {old[:100]}")
              text = text.replace(old, new, 1)

          current = re.compile(r"### Sprint 3\.4 — Risk Lab em Produção e smoke ponta a ponta\n.*?(?=\n## 4\.)", re.S)
          current_text = """### Sprint 3.5 — Coorte externa e backtest sem informação futura

          **Objetivo:** verificar a coorte pré-registrada em fontes primárias e executar o backtest sem informação futura, preservando integralmente o ruleset `v0.1.0`.

          **Trabalho obrigatório:**

          1. confirmar `knownAt`, URL, trecho, página, hash e versão por observação;
          2. executar `DEVA11`, `VSLH11`, `KNCR11`, `KNSC11`, `MCCI11` e `RBRY11` sem look-ahead;
          3. medir antecedência, falsos positivos, falsos negativos, inconclusão e cobertura;
          4. manter `executionAllowed=false` enquanto faltar verificação primária;
          5. versionar a evidência e preservar o ruleset congelado.

          **Critério de aceite:** nenhuma conclusão final sustentada apenas por fonte secundária; controles saudáveis sem vermelho injustificado; ambiguidades como inconclusivas; métricas e evidências persistidas no Git.
          """
          text, count = current.subn(current_text.rstrip(), text, count=1)
          if count != 1:
              raise SystemExit("Current Sprint 3.4 section was not replaced exactly once")

          track = re.compile(r"### Trilha principal de produto\n\n.*?(?=\n### Trilha SEO)", re.S)
          track_text = """### Trilha principal de produto

          1. **Sprint 3.5 — Coorte externa e backtest sem informação futura.**
          2. **Sprint 3.6 — Métricas, calibração e gate formal.**
          3. **Sprint 3.7 — Risk Lab read-only no Relatório Premium e Prompt Premium v3.**
          4. **Sprint 3.8 — Impacto na carteira e alertas opt-in.**
          5. **Sprint 4.1 — Radar: acompanhar fundo fora da carteira.**
          6. **Sprint 4.2 — Radar: eventos, tese e relatório pré-compra.**
          7. **Sprint 4.3 — Planos, preferências, canais e monetização.**
          8. **Sprint 5.1 — Carteira histórica verdadeira e ledger de eventos.**
          9. **Sprint 5.2 — Motor de risco, exposição e atribuição acionável.**
          10. **Sprint 5.3 — Inteligência sobre comunicados oficiais.**
          11. **Sprint 5.4 — Screener quantitativo, pares e fair value por tipo de FII.**
          12. **Sprint 5.5 — Benchmark, retorno total, calendário, centro fiscal e simuladores.**
          """
          text, count = track.subn(track_text.rstrip(), text, count=1)
          if count != 1:
              raise SystemExit("Official sprint order was not replaced exactly once")

          path.write_text(text)
          PY

          rm -f .github/workflows/risk-lab-production-smoke.yml
          rm -f .github/workflows/risk-lab-3-4-closure-builder.yml

      - name: Validate formal closure
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent
          npm run typecheck
          npm run test:risk-lab
          npm run test:sprint2

      - name: Commit closure and open pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: formaliza conclusão da Sprint 3.4"
          git push origin agent/risk-lab-3-4-formal-closure

          pr_url=$(gh pr create \
            --base main \
            --head agent/risk-lab-3-4-formal-closure \
            --title "chore: formaliza conclusão da Sprint 3.4" \
            --body "## Encerramento auditável

          - smoke de Produção: 11/11 checks;
          - matriz: 6/6 casos;
          - evidência: \`deb0f79597c2fbfb87214c6d05df37cbe782e084e4a7289a487042c3582a567f\`;
          - Premium integrado: não;
          - notificações enviadas: não;
          - gatilho temporário removido;
          - rota pública mantida somente leitura;
          - Sprint corrente atualizada para 3.5.")

          pr_number="${pr_url##*/}"
          sed -i "s/#PENDING/#${pr_number}/" DADOS_FII_HANDOFF.md
          git add DADOS_FII_HANDOFF.md
          git commit -m "docs: registra PR de encerramento da Sprint 3.4"
          git push origin agent/risk-lab-3-4-formal-closure
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
