name: Risk Lab Sprint 3.4 Closure

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "docs/production-evidence/risk-lab/risk-lab-3-4-20260720-v1.json"
      - ".github/risk-lab-closure.trigger"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: risk-lab-sprint-3-4-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  close-sprint:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'automation/risk-lab-3-4-release-0072ecf340e6'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Prepare canonical closure
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          evidence_path="docs/production-evidence/risk-lab/risk-lab-3-4-20260720-v1.json"

          jq -e '
            .status == "passed"
            and .sprint == "3.4"
            and .runId == "risk-lab-3-4-20260720-v1"
            and .releaseCommit == "e9a5d6ec263c0aa87961133a361891f60175dba4"
            and .evidenceHash == "deb0f79597c2fbfb87214c6d05df37cbe782e084e4a7289a487042c3582a567f"
            and (.checks | length) == 11
            and ([.checks[].status] | all(. == "passed"))
            and (.cases | length) == 6
            and (.blockers | length) == 0
            and ([.cases[].premiumIntegrated] | all(. == false))
            and ([.cases[].notificationsSent] | all(. == false))
          ' "$evidence_path" >/dev/null

          if [[ -f .github/scripts/close-risk-lab-3-4.py ]]; then
            python3 .github/scripts/close-risk-lab-3-4.py
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate closure
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent
          npm run typecheck
          npm run test:risk-lab
          npm run test:sprint2

      - name: Commit closure to evidence branch
        if: steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "chore: formaliza conclusão da Sprint 3.4"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
