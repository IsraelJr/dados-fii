name: Sprint 3.5 Backtest Kickoff

# O processamento da coorte ocorre no backend e persiste estado no Firestore.
# O Actions somente registra uma release explicitamente escolhida e inicia a tentativa.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "SHA de 40 caracteres já ativo em Produção"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: risk-lab-backtest-kickoff-${{ inputs.release_sha }}
  cancel-in-progress: true

jobs:
  kickoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_ORIGIN: https://dadosfii.com.br
      RELEASE_COMMIT: ${{ inputs.release_sha }}
    steps:
      - name: Validate release identifier
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "release_sha deve ser um SHA Git completo de 40 caracteres."
            exit 1
          fi

      - name: Obtain scoped GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("dados-fii-risk-lab-operation");
            core.setSecret(token);
            core.setOutput("token", token);

      - name: Initialize exactly one persisted attempt
        id: initialize
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$OIDC_TOKEN"
          endpoint="${PRODUCTION_ORIGIN}/api/admin/system/risk-lab/cohort-backtest"
          http_code=$(curl --silent --show-error --location --max-time 75 \
            --output risk-lab-cohort-initialize.json --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"action":"initialize"}' \
            "$endpoint")

          if [[ "$http_code" != "200" ]]; then
            cat risk-lab-cohort-initialize.json || true
            echo "A release informada não está ativa ou o backend recusou a inicialização (HTTP ${http_code})."
            exit 1
          fi

          jq -e --arg release "$RELEASE_COMMIT" '
            .evidence.releaseCommit == $release
            and .evidence.runId == "risk-lab-3-5-20260720-v2"
            and (.evidence.status == "running" or .evidence.status == "passed" or .evidence.status == "failed")
          ' risk-lab-cohort-initialize.json >/dev/null

          status=$(jq -r '.evidence.status' risk-lab-cohort-initialize.json)
          attempt_id=$(jq -r '.evidence.attemptId // "n/a"' risk-lab-cohort-initialize.json)
          persisted=$(jq -r '.evidence.cases | length' risk-lab-cohort-initialize.json)
          {
            echo "## Sprint 3.5 — tentativa iniciada"
            echo "- Release: \`${RELEASE_COMMIT}\`"
            echo "- Run ID: \`risk-lab-3-5-20260720-v2\`"
            echo "- Attempt ID: \`${attempt_id}\`"
            echo "- Status: \`${status}\`"
            echo "- Casos já persistidos: \`${persisted}/6\`"
            echo "- Continuação: backend administrativo segmentado; o runner não fará polling."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve short kickoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-lab-backtest-kickoff-${{ inputs.release_sha }}
          path: risk-lab-cohort-initialize.json
          if-no-files-found: warn
          retention-days: 3
