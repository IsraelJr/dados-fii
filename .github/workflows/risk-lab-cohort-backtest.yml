name: Sprint 3.5 Production Backtest

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/risk-lab-cohort-backtest.yml"
      - "docs/production-evidence/risk-lab/sprint-3-5-deploy-trigger.json"
      - "src/app/api/system/risk-lab-cohort-backtest/**"
      - "src/app/api/admin/system/risk-lab/cohort-backtest/**"
      - "src/app/admin/risk-lab/CohortBacktestPanel.tsx"
      - "src/app/admin/risk-lab/cohort-backtest/**"
      - "src/app/admin/risk-lab/layout.tsx"
      - "src/lib/risk-lab/**"
      - "src/types/riskLabCohortBacktest.ts"
      - "src/types/riskLabDividendStress.ts"
      - "scripts/finalize-risk-lab-sprint-3-5.mjs"
      - "tests/risk-lab-cohort-backtest*"
      - "tests/risk-lab-credit-ambiguity-policy.test.ts"
      - "tests/risk-lab-fnet-notice-parser.test.ts"
      - "tests/risk-lab-cohort-admin-architecture.test.mjs"
      - "tests/risk-lab-sprint-3-5-closure.test.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: risk-lab-cohort-backtest-production
  cancel-in-progress: true

jobs:
  production-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_ID: risk-lab-3-5-20260720-v2
      PRODUCTION_ORIGIN: https://dadosfii.com.br
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wait for exact production deployment and execute cohort
        id: production
        shell: bash
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          endpoint="${PRODUCTION_ORIGIN}/api/system/risk-lab-cohort-backtest?source=github-actions&runId=${RUN_ID}&release=${RELEASE_COMMIT}"
          : > risk-lab-cohort-backtest-response.json
          observed=false

          for attempt in $(seq 1 10); do
            echo "Attempt ${attempt}/10 for release ${RELEASE_COMMIT}"
            http_code=$(curl \
              --silent \
              --show-error \
              --location \
              --max-time 310 \
              --output risk-lab-cohort-backtest-response.json \
              --write-out "%{http_code}" \
              "$endpoint" || true)

            if [[ "$http_code" == "200" ]]; then
              release=$(jq -r '.evidence.releaseCommit // ""' risk-lab-cohort-backtest-response.json 2>/dev/null || true)
              run_id=$(jq -r '.evidence.runId // ""' risk-lab-cohort-backtest-response.json 2>/dev/null || true)
              status=$(jq -r '.evidence.status // ""' risk-lab-cohort-backtest-response.json 2>/dev/null || true)
              hash=$(jq -r '.evidence.evidenceHash // ""' risk-lab-cohort-backtest-response.json 2>/dev/null || true)
              if [[ "$run_id" == "$RUN_ID" && "$release" == "$RELEASE_COMMIT" && ( "$status" == "passed" || "$status" == "failed" ) && ${#hash} -eq 64 ]]; then
                observed=true
                break
              fi
            fi

            echo "Deployment exato ainda não observado (HTTP ${http_code})."
            cat risk-lab-cohort-backtest-response.json || true
            sleep 30
          done

          if [[ "$observed" != "true" ]]; then
            echo "O deployment exato não produziu evidência final no intervalo permitido."
            exit 1
          fi

          jq -e '
            .sprint == "3.5"
            and .evidence.schemaVersion == 2
            and .evidence.methodologyVersion == "2.0.0"
            and (.evidence.attemptId | test("^risk-lab-3-5-attempt-"))
            and (.evidence.cases | length == 6)
            and (.evidence.checks | length >= 12)
            and (.evidence.evidenceHash | test("^[a-f0-9]{64}$"))
            and (.evidence.premiumIntegrated == false)
            and (.evidence.notificationsSent == false)
          ' risk-lab-cohort-backtest-response.json >/dev/null

      - name: Upload production response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-lab-cohort-backtest-production-v2
          path: risk-lab-cohort-backtest-response.json
          if-no-files-found: error
          retention-days: 30

      - name: Version, validate and formalize production evidence
        if: steps.production.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence_dir="docs/production-evidence/risk-lab"
          evidence_path="${evidence_dir}/${RUN_ID}.json"
          summary_path="docs/risk-lab/sprint-3-5-production-backtest.md"
          branch="automation/sprint-3-5-evidence-v2-${GITHUB_RUN_ID}"
          mkdir -p "$evidence_dir" "$(dirname "$summary_path")"

          jq '.evidence' risk-lab-cohort-backtest-response.json > "$evidence_path"
          status=$(jq -r '.status' "$evidence_path")
          attempt_id=$(jq -r '.attemptId' "$evidence_path")
          release=$(jq -r '.releaseCommit' "$evidence_path")
          evidence_hash=$(jq -r '.evidenceHash' "$evidence_path")
          coverage=$(jq -r '.metrics.coveragePercent' "$evidence_path")
          false_positives=$(jq -r '.metrics.falsePositives' "$evidence_path")
          false_negatives=$(jq -r '.metrics.falseNegatives' "$evidence_path")
          inconclusive=$(jq -r '.metrics.inconclusiveCases' "$evidence_path")
          blockers=$(jq -r '.blockers | length' "$evidence_path")
          performance_review=$(jq -r '.performanceReviewRequired' "$evidence_path")

          cat > "$summary_path" <<EOF
          # Sprint 3.5 — Backtest externo em Produção

          - Status metodológico: \`${status}\`
          - Tentativa imutável: \`${attempt_id}\`
          - Release executado: \`${release}\`
          - Cobertura conclusiva: \`${coverage}%\`
          - Falsos positivos: \`${false_positives}\`
          - Falsos negativos medidos: \`${false_negatives}\`
          - Casos inconclusivos: \`${inconclusive}\`
          - Blockers metodológicos: \`${blockers}\`
          - Revisão de desempenho na Sprint 3.6: \`${performance_review}\`
          - Hash da evidência: \`${evidence_hash}\`
          - Premium integrado: \`false\`
          - Notificações enviadas: \`false\`

          O resultado foi produzido automaticamente no deployment exato de Produção. A Sprint 3.5 valida integridade, cobertura e ausência de look-ahead; a aprovação ou rejeição do ruleset pertence ao gate formal da Sprint 3.6.
          EOF

          if [[ "$status" == "passed" ]]; then
            npm install --silent
            npm run typecheck
            npm run test:risk-lab
            npm run test:sprint2
            node scripts/finalize-risk-lab-sprint-3-5.mjs "$evidence_path" DADOS_FII_HANDOFF.md
            title="chore: formaliza evidência metodológica da Sprint 3.5"
          else
            title="audit: registra blockers metodológicos da Sprint 3.5"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$evidence_path" "$summary_path"
          if [[ "$status" == "passed" ]]; then
            git add DADOS_FII_HANDOFF.md
          fi
          git commit -m "docs: versiona evidência metodológica da Sprint 3.5"
          git push origin "$branch"

          pr_url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "$title" \
            --body "## Auditoria automática de Produção

          - tentativa: \`${attempt_id}\`
          - release: \`${release}\`
          - status metodológico: \`${status}\`
          - cobertura: \`${coverage}%\`
          - falsos positivos: \`${false_positives}\`
          - falsos negativos medidos: \`${false_negatives}\`
          - inconclusivos: \`${inconclusive}\`
          - blockers metodológicos: \`${blockers}\`
          - revisão de desempenho na Sprint 3.6: \`${performance_review}\`
          - hash: \`${evidence_hash}\`

          Nenhuma aprovação técnica manual do proprietário foi usada e o ruleset v0.1.0 não foi recalibrado com a mesma coorte.")

          if [[ "$status" != "passed" ]]; then
            echo "A evidência e os blockers foram versionados na PR ${pr_url}; a Sprint permanece aberta."
            exit 1
          fi

          if ! gh pr merge "$pr_url" --squash --delete-branch; then
            gh pr merge "$pr_url" --auto --squash --delete-branch
          fi
