name: Sprint 3.5 Deployment Recovery

# A recuperação periódica foi pausada quando a Sprint 3.5 deixou de ser tratada
# como uma entrega monolítica. O workflow permanece disponível apenas para
# execução manual futura, depois que as fases de coleta e validação forem concluídas.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: risk-lab-cohort-deploy-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_ID: risk-lab-3-5-20260720-v2
      PRODUCTION_ORIGIN: https://dadosfii.com.br
      MARKER_PATH: docs/production-evidence/risk-lab/sprint-3-5-deploy-trigger.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect production evidence for the current deployable commit
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          current_release=$(git rev-parse HEAD)
          response_file="risk-lab-cohort-public-response.json"
          http_code=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 45 \
            --output "$response_file" \
            --write-out "%{http_code}" \
            "${PRODUCTION_ORIGIN}/api/system/risk-lab-cohort-backtest" || true)

          run_id=$(jq -r '.evidence.runId // ""' "$response_file" 2>/dev/null || true)
          release=$(jq -r '.evidence.releaseCommit // ""' "$response_file" 2>/dev/null || true)
          status=$(jq -r '.evidence.status // .status // "pending"' "$response_file" 2>/dev/null || echo pending)
          evidence_hash=$(jq -r '.evidence.evidenceHash // ""' "$response_file" 2>/dev/null || true)

          completed=false
          if [[ "$http_code" == "200" \
            && "$run_id" == "$RUN_ID" \
            && "$release" == "$current_release" \
            && ( "$status" == "passed" || "$status" == "failed" ) \
            && ${#evidence_hash} -eq 64 ]]; then
            completed=true
          fi

          echo "http_code=${http_code}" >> "$GITHUB_OUTPUT"
          echo "current_release=${current_release}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "completed=${completed}" >> "$GITHUB_OUTPUT"

      - name: Stop when final evidence already exists for the current deployable commit
        if: steps.inspect.outputs.completed == 'true'
        shell: bash
        run: |
          echo "A execução ${RUN_ID} já possui evidência final para ${{ steps.inspect.outputs.current_release }}. Nenhum novo deploy será disparado."

      - name: Retrigger production deployment with a logically bounded marker
        if: steps.inspect.outputs.completed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          current_release="${{ steps.inspect.outputs.current_release }}"
          current_subject=$(git log -1 --pretty=%s)
          marker_release=$(jq -r '.targetRelease // ""' "$MARKER_PATH")
          maximum_attempts=$(jq -r '.maximumAttempts // 6' "$MARKER_PATH")

          # Commits de recovery são apenas gatilhos de deploy. Eles não criam um novo
          # orçamento: toda a cadeia continua vinculada à release lógica que originou
          # a primeira tentativa. Um commit funcional novo reinicia o orçamento.
          if [[ "$current_subject" == "ci: reaciona deploy da Sprint 3.5 para "* \
            && "$marker_release" =~ ^[a-f0-9]{40}$ ]]; then
            target_release="$marker_release"
            current_attempt=$(jq -r '.attempt // 0' "$MARKER_PATH")
          elif [[ "$marker_release" == "$current_release" ]]; then
            target_release="$current_release"
            current_attempt=$(jq -r '.attempt // 0' "$MARKER_PATH")
          else
            target_release="$current_release"
            current_attempt=0
          fi

          if ! [[ "$current_attempt" =~ ^[0-9]+$ && "$maximum_attempts" =~ ^[0-9]+$ ]]; then
            echo "Marcador de recuperação inválido."
            exit 1
          fi
          if (( current_attempt >= maximum_attempts )); then
            echo "Limite de ${maximum_attempts} tentativas automáticas atingido para a release lógica ${target_release} sem evidência final."
            exit 1
          fi

          next_attempt=$((current_attempt + 1))
          triggered_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq \
            --arg targetRelease "$target_release" \
            --argjson attempt "$next_attempt" \
            --arg triggeredAt "$triggered_at" \
            --arg httpStatus "${{ steps.inspect.outputs.http_code }}" \
            --arg release "${{ steps.inspect.outputs.release }}" \
            --arg status "${{ steps.inspect.outputs.status }}" \
            '.schemaVersion = 3
             | .targetRelease = $targetRelease
             | .attempt = $attempt
             | .lastTriggeredAt = $triggeredAt
             | .lastObservedHttpStatus = $httpStatus
             | .lastObservedRelease = ($release | select(length > 0) // null)
             | .lastObservedStatus = $status
             | .reason = "Deployment do commit implantável atual ainda não produziu evidência final; novo push espaçado foi criado automaticamente dentro do orçamento da release lógica."
             | .completed = false' \
            "$MARKER_PATH" > "${MARKER_PATH}.tmp"
          mv "${MARKER_PATH}.tmp" "$MARKER_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MARKER_PATH"
          git commit -m "ci: reaciona deploy da Sprint 3.5 para ${target_release} (${next_attempt}/${maximum_attempts})"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run risk-lab-cohort-backtest.yml --ref main
