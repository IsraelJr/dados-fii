name: Risk Lab 3.5-C Primary Truth

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/risk-lab-cohort-primary-truth-pr.yml"
      - "scripts/diagnose-risk-lab-cohort-primary-truth.ts"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - run: node --import ./tests/register-ts-loader.mjs --experimental-strip-types scripts/diagnose-risk-lab-cohort-primary-truth.ts
      - uses: actions/upload-artifact@v4
        with:
          name: risk-lab-cohort-primary-truth-${{ github.run_id }}
          path: risk-lab-cohort-primary-truth-diagnostic.json
          if-no-files-found: error
          retention-days: 3
