name: Risk Lab 3.5-C Critical PDFs

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/risk-lab-critical-pdf-diagnostic.yml"
      - "scripts/diagnose-risk-lab-critical-pdfs.mjs"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/diagnose-risk-lab-critical-pdfs.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: risk-lab-critical-pdf-diagnostic-${{ github.run_id }}
          path: risk-lab-critical-pdf-diagnostic.json
          if-no-files-found: error
          retention-days: 3
