name: Sprint 3.5 Frozen Dividend Notices

# Exceção temporária documentada: a coleta ainda usa o runner por depender do
# script de engenharia e de artefatos ligados ao SHA. Não há disparo automático,
# espera por deploy, commits, branches ou PRs intermediárias.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "SHA de 40 caracteres já ativo em Produção"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: risk-lab-frozen-dividend-notices-${{ inputs.release_sha }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # governance-exception: migração para fila/backend registrada na política
    env:
      RUN_ID: risk-lab-3-5-20260720-v2
      PRODUCTION_ORIGIN: https://dadosfii.com.br
      RELEASE_COMMIT: ${{ inputs.release_sha }}
      OUTPUT_PATH: src/lib/risk-lab/frozen-dividend-notices-v0.1.json
      CHECKPOINT_PATH: .tmp/risk-lab-dividend-notices-checkpoint.json
      SUMMARY_PATH: docs/risk-lab/sprint-3-5-frozen-dividend-notices.md
      CHECKPOINT_ARTIFACT: risk-lab-frozen-dividend-checkpoint-v3
    steps:
      - name: Validate release identifier
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "release_sha deve ser um SHA Git completo de 40 caracteres."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frozen dependencies
        run: npm ci --silent

      - name: Locate previous checkpoint
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${CHECKPOINT_ARTIFACT}&per_page=30" \
            --jq '[.artifacts[] | select(.expired == false) | select((.workflow_run.id | tostring) != env.GITHUB_RUN_ID) | .workflow_run.id] | .[0] // empty' || true)
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Restore previous checkpoint
        if: steps.previous.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CHECKPOINT_ARTIFACT }}
          path: .checkpoint-restore
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run_id }}

      - name: Normalize restored checkpoint
        if: steps.previous.outputs.run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$CHECKPOINT_PATH")"
          restored=$(find .checkpoint-restore -type f -name 'risk-lab-dividend-notices-checkpoint.json' -print -quit || true)
          if [[ -n "$restored" ]]; then cp "$restored" "$CHECKPOINT_PATH"; fi

      - name: Fetch frozen identities once
        id: identities
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${PRODUCTION_ORIGIN}/api/system/risk-lab-cohort-backtest?source=github-actions&runId=${RUN_ID}&release=${RELEASE_COMMIT}&action=identities"
          mkdir -p .tmp
          http_code=$(curl --silent --show-error --location --max-time 75 \
            --output .tmp/risk-lab-cohort-identities.json --write-out "%{http_code}" \
            "$endpoint")
          if [[ "$http_code" != "200" ]]; then
            cat .tmp/risk-lab-cohort-identities.json || true
            echo "A release informada não expôs as identidades congeladas (HTTP ${http_code})."
            exit 1
          fi
          jq -e --arg release "$RELEASE_COMMIT" '
            .releaseCommit == $release and (.identities | length) == 6
          ' .tmp/risk-lab-cohort-identities.json >/dev/null
          echo "endpoint=${endpoint}" >> "$GITHUB_OUTPUT"

      - name: Collect structured notices with resumable checkpoint
        id: collection
        continue-on-error: true
        shell: bash
        env:
          IDENTITIES_ENDPOINT: ${{ steps.identities.outputs.endpoint }}
        run: |
          set -o pipefail
          node --import ./tests/register-ts-loader.mjs --experimental-strip-types \
            scripts/collect-risk-lab-dividend-notices.ts 2>&1 | tee .tmp/risk-lab-frozen-dividend-collection.log

      - name: Validate completed dataset when available
        id: validation
        if: steps.collection.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          jq -e --arg release "$RELEASE_COMMIT" '
            .schemaVersion == 1
            and .datasetId == "risk-lab-fnet-dividend-notices-v0.1"
            and .datasetVersion == "0.1.0"
            and .status == "complete"
            and .releaseCommit == $release
            and (.cases | length) == 6
            and ([.cases[] | select(.status != "complete" or (.pendingDocumentIds | length) != 0 or (.conflicts | length) != 0)] | length == 0)
            and (.datasetHash | test("^[a-f0-9]{64}$"))
          ' "$OUTPUT_PATH"

      - name: Upload short-lived checkpoint and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CHECKPOINT_ARTIFACT }}
          path: |
            .tmp/risk-lab-dividend-notices-checkpoint.json
            .tmp/risk-lab-cohort-identities.json
            .tmp/risk-lab-frozen-dividend-collection.log
            src/lib/risk-lab/frozen-dividend-notices-v0.1.json
            docs/risk-lab/sprint-3-5-frozen-dividend-notices.md
          if-no-files-found: warn
          retention-days: 3

      - name: Summarize result
        if: always()
        shell: bash
        run: |
          status=$(jq -r '.status // "unavailable"' "$OUTPUT_PATH" 2>/dev/null || echo unavailable)
          pending=$(jq '[.cases[].pendingDocumentIds[]] | length' "$OUTPUT_PATH" 2>/dev/null || echo unknown)
          hash=$(jq -r '.datasetHash // "none"' "$OUTPUT_PATH" 2>/dev/null || echo none)
          {
            echo "## Coleta congelada da Sprint 3.5"
            echo "- Release: \`${RELEASE_COMMIT}\`"
            echo "- Status: \`${status}\`"
            echo "- Pendências: \`${pending}\`"
            echo "- Hash: \`${hash}\`"
            echo "- Branch/PR automática: \`não\`"
            echo "- Retenção do diagnóstico: \`3 dias\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce complete collection
        if: steps.collection.outcome != 'success' || steps.validation.outcome != 'success'
        run: exit 1
