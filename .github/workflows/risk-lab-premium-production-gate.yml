name: Risk Lab Premium Production Gate

on:
  status:

permissions:
  contents: read
  statuses: write

concurrency:
  group: risk-lab-premium-production-gate-${{ github.event.sha }}
  cancel-in-progress: true

jobs:
  validate-production:
    if: >-
      github.event.context == 'Vercel' &&
      github.event.state == 'success' &&
      contains(github.event.branches.*.name, 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate deployed SHA and read-only policy
        id: validate
        shell: bash
        env:
          CONFIGURED_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          EXPECTED_SHA: ${{ github.event.sha }}
        run: |
          set -euo pipefail

          if [[ -n "${CONFIGURED_BASE_URL}" ]]; then
            BASE_URLS=("${CONFIGURED_BASE_URL%/}")
          else
            BASE_URLS=("https://www.dadosfii.com.br" "https://dadosfii.com.br")
          fi

          rm -f response.json
          for base_url in "${BASE_URLS[@]}"; do
            endpoint="${base_url}/api/health/risk-lab-premium"
            http_code=$(curl --location --silent --show-error \
              --connect-timeout 8 --max-time 20 \
              --output response.json --write-out "%{http_code}" \
              "${endpoint}" || true)

            if [[ "${http_code}" == "200" ]] && node --input-type=module - "${EXPECTED_SHA}" response.json <<'NODE'
          import { readFileSync } from "node:fs";
          import process from "node:process";

          const expectedCommit = process.argv[2];
          const responsePath = process.argv[3];
          let payload;
          try {
            payload = JSON.parse(readFileSync(responsePath, "utf8"));
          } catch {
            process.exit(1);
          }

          const valid = payload.ok === true
            && payload.enabled === true
            && payload.mode === "read_only"
            && payload.registryVersion === "premium-readonly-v1"
            && payload.rulesetVersion === "0.2.0"
            && payload.notificationsAllowed === false
            && payload.externalEffectsAllowed === false
            && payload.deploymentCommit === expectedCommit;

          if (!valid) {
            console.error(JSON.stringify(payload));
            process.exit(1);
          }
          NODE
            then
              echo "Produção validada em ${endpoint} no commit ${EXPECTED_SHA}."
              cat response.json
              exit 0
            fi
          done

          echo "Gate de produção não confirmou o SHA ${EXPECTED_SHA}."
          [[ -f response.json ]] && cat response.json
          exit 1

      - name: Publish auditable commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.sha }}
          GATE_STATE: ${{ steps.validate.outcome == 'success' && 'success' || 'failure' }}
          GATE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(jq -nc \
            --arg state "${GATE_STATE}" \
            --arg context "Risk Lab Premium Production Gate" \
            --arg description "Double check pós-deploy do Risk Lab Premium read-only" \
            --arg target_url "${GATE_URL}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "${payload}"
