name: Risk Lab Production Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/risk-lab-production-smoke.yml"
      - "src/app/api/system/risk-lab-production-smoke/**"
      - "src/lib/risk-lab/RiskLabProductionSmokeService.ts"
      - "src/lib/risk-lab/RiskLabProductionSmokeStore.ts"
      - "src/lib/risk-lab/RiskLabAutomaticOrchestrator.ts"
      - "src/lib/risk-lab/RiskLabAutomaticScanStore.ts"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: risk-lab-production-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_ID: risk-lab-3-4-20260720-v1
      PRODUCTION_ORIGIN: https://dadosfii.com.br
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for the exact production deployment and run smoke
        shell: bash
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          endpoint="${PRODUCTION_ORIGIN}/api/system/risk-lab-production-smoke?source=github-actions&runId=${RUN_ID}&release=${RELEASE_COMMIT}"
          : > risk-lab-production-smoke-response.json
          passed=false

          for attempt in $(seq 1 30); do
            echo "Attempt ${attempt}/30 for release ${RELEASE_COMMIT}"
            http_code=$(curl --silent --show-error --location \
              --max-time 320 \
              --output risk-lab-production-smoke-response.json \
              --write-out "%{http_code}" \
              "$endpoint" || true)

            if [[ "$http_code" == "200" ]]; then
              status=$(jq -r '.status // "unknown"' risk-lab-production-smoke-response.json)
              if [[ "$status" == "passed" ]]; then
                echo "Sprint 3.4 production smoke passed."
                passed=true
                break
              fi
              echo "Unexpected successful response with status: ${status}"
              cat risk-lab-production-smoke-response.json
              exit 1
            fi

            if [[ "$http_code" == "422" ]]; then
              echo "Sprint 3.4 smoke executed and failed its gates."
              cat risk-lab-production-smoke-response.json
              exit 1
            fi

            if [[ "$http_code" != "409" && "$http_code" != "000" && "$http_code" != "503" ]]; then
              echo "Unexpected HTTP ${http_code}."
              cat risk-lab-production-smoke-response.json
              exit 1
            fi

            sleep 20
          done

          if [[ "$passed" != "true" ]]; then
            echo "The exact production deployment was not observed within the allowed window."
            cat risk-lab-production-smoke-response.json
            exit 1
          fi

          jq -e '.ok == true and .status == "passed" and .evidence.status == "passed"' \
            risk-lab-production-smoke-response.json >/dev/null

      - name: Upload sanitized production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-lab-production-smoke-${{ github.sha }}
          path: risk-lab-production-smoke-response.json
          if-no-files-found: error
          retention-days: 30

      - name: Prepare canonical closure changes
        shell: bash
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          evidence_dir="docs/production-evidence/risk-lab"
          evidence_path="${evidence_dir}/${RUN_ID}.json"
          mkdir -p "$evidence_dir"
          jq '.evidence' risk-lab-production-smoke-response.json > "$evidence_path"
          jq -e '.status == "passed" and (.evidenceHash | length == 64)' "$evidence_path" >/dev/null

          cat > "${evidence_dir}/README.md" <<'EOF'
          # Evidências de Produção — Risk Lab

          Este diretório contém evidências sanitizadas, versionadas e reproduzíveis das homologações do Risk Lab.

          A Sprint 3.4 somente é considerada concluída quando o arquivo de evidência registra `status: passed`, o commit exato de Produção, todos os casos obrigatórios, os checks de persistência/auditoria e a ausência de integração com Premium ou notificações.
          EOF

          cat > src/app/api/system/risk-lab-production-smoke/route.ts <<'EOF'
          import { NextResponse } from "next/server";
          import { riskLabProductionSmokeService } from "@/lib/risk-lab/RiskLabProductionSmokeService";

          export const runtime = "nodejs";
          export const dynamic = "force-dynamic";

          export async function GET() {
            try {
              const evidence = await riskLabProductionSmokeService.getPublicEvidence();
              return NextResponse.json({
                ok: evidence?.status === "passed",
                sprint: "3.4",
                status: evidence?.status || "pending",
                evidence,
              }, {
                headers: {
                  "Cache-Control": "no-store",
                  "Pragma": "no-cache",
                  "X-Robots-Tag": "noindex, nofollow",
                  "X-Content-Type-Options": "nosniff",
                },
              });
            } catch (error) {
              console.error("Risk Lab production smoke evidence error", error instanceof Error ? error.message : "unknown");
              return NextResponse.json({ ok: false, sprint: "3.4", status: "unavailable" }, {
                status: 503,
                headers: { "Cache-Control": "no-store", "X-Robots-Tag": "noindex, nofollow" },
              });
            }
          }
          EOF

          cat > tests/risk-lab-production-smoke-architecture.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { existsSync, readFileSync } from "node:fs";
          import test from "node:test";

          const smokeService = readFileSync("src/lib/risk-lab/RiskLabProductionSmokeService.ts", "utf8");
          const smokeStore = readFileSync("src/lib/risk-lab/RiskLabProductionSmokeStore.ts", "utf8");
          const scanStore = readFileSync("src/lib/risk-lab/RiskLabAutomaticScanStore.ts", "utf8");
          const smokeRoute = readFileSync("src/app/api/system/risk-lab-production-smoke/route.ts", "utf8");
          const adminRoute = readFileSync("src/app/api/admin/system/risk-lab/automatic/route.ts", "utf8");

          function executable(source) {
            return source.replace(/\/\*[\s\S]*?\*\//g, "").replace(/^\s*\/\/.*$/gm, "");
          }

          test("production smoke covers the official Sprint 3.4 matrix", () => {
            for (const value of ["HCTR11", "MCCI11", "RBRY11", "invalid-ticker", "insufficient-series", "ambiguous-credit-event"]) {
              assert.match(smokeService, new RegExp(value));
            }
            for (const checkId of ["deployment.production", "feature.automatic-discovery", "rate-limit.contract", "persistence.scans", "audit.scans", "isolation.external-effects", "integrity.scan-hashes"]) {
              assert.match(smokeService, new RegExp(checkId.replaceAll(".", "\\.")));
            }
          });

          test("automatic scans and smoke evidence use repositories with locks and audit", () => {
            assert.match(scanStore, /RiskLabAutomaticScans/);
            assert.match(scanStore, /RiskLabAutomaticScanAudit/);
            assert.match(scanStore, /runTransaction/);
            assert.match(smokeStore, /RiskLabProductionSmokeRuns/);
            assert.match(smokeStore, /RiskLabProductionSmokeAudit/);
            assert.match(smokeStore, /RiskLabProductionSmokeLocks/);
            assert.match(smokeStore, /acquireLock/);
            assert.match(smokeStore, /releaseLock/);
            assert.match(adminRoute, /repository:\s*riskLabAutomaticScanStore/);
          });

          test("production evidence route is permanently read-only after closure", () => {
            assert.match(smokeRoute, /export async function GET\(\)/);
            assert.match(smokeRoute, /getPublicEvidence/);
            assert.doesNotMatch(smokeRoute, /NextRequest|searchParams|run\(\)|VERCEL_GIT_COMMIT_SHA|github-actions|TOKEN/);
            assert.equal(existsSync(".github/workflows/risk-lab-production-smoke.yml"), false);
          });

          test("smoke remains isolated from Premium and notifications", () => {
            const source = executable(smokeService);
            assert.doesNotMatch(source, /getPremiumReport|AIInsights|sendEmail|sendNotification|createAlert/);
            assert.match(source, /premiumIntegrated:\s*false/);
            assert.match(source, /notificationsSent:\s*false/);
            assert.match(adminRoute, /RISK_LAB_AUTOMATIC_RATE_LIMIT/);
          });
          EOF

          python <<'PY'
          import json
          import re
          from pathlib import Path

          evidence_path = Path("docs/production-evidence/risk-lab/risk-lab-3-4-20260720-v1.json")
          evidence = json.loads(evidence_path.read_text())
          release = evidence["releaseCommit"]
          evidence_hash = evidence["evidenceHash"]
          check_count = len(evidence["checks"])
          case_count = len(evidence["cases"])

          handoff = Path("DADOS_FII_HANDOFF.md")
          text = handoff.read_text()
          replacements = {
              "**Versão:** 6.1.0": "**Versão:** 6.2.0",
              "**Commit auditado em Produção:** `f4602e223e04c2d917b22a19391dbbd9e6f6286b`": f"**Commit auditado em Produção:** `{release}`",
              "**Branch desta atualização:** `agent/phase-2-formal-closure`": "**Branch desta atualização:** `automation/risk-lab-3-4-closure`",
              "**PR desta atualização:** #50 — `chore: formaliza encerramento auditável da Fase 2`": "**PR desta atualização:** `PENDING_PR` — `chore: formaliza conclusão da Sprint 3.4`",
              "| Sprint corrente canônica: **3.4 — Risk Lab em Produção e smoke ponta a ponta**. | Sprint 2.12 como sprint corrente. | A Sprint 2.12 foi concluída; a próxima pendência operacional é homologar o Risk Lab sem integrá-lo ainda ao Premium ou às notificações. |": "| Sprint corrente canônica: **3.5 — Coorte externa e backtest sem informação futura**. | Sprint 3.4 como sprint corrente. | A Sprint 3.4 foi homologada em Produção com evidência auditável, mantendo o Risk Lab isolado do Premium e das notificações. |",
              "- O Risk Lab está implementado em código até a PR #41, mas continua isolado do Premium e das notificações. A coorte externa permanece bloqueada até verificação primária.": f"- A Sprint 3.4 do Risk Lab foi concluída em Produção com {check_count}/{check_count} checks e {case_count} casos obrigatórios; evidência `{evidence_hash}`. O Risk Lab continua isolado do Premium e das notificações, e a coorte externa permanece bloqueada até verificação primária.",
              "| Fase 3 — Risk Lab | Sim, até 3.3 | Sim | Deployment geral verde | Smoke autenticado e coorte ausentes | Em andamento |": f"| Fase 3 — Risk Lab | Sim, até 3.4 | Sim | Sim (`{release[:7]}`, Vercel verde) | Smoke 3.4 aprovado; coorte externa pendente | Em andamento |",
              "**Em andamento.** As Sprints 3.0 a 3.3 possuem código e testes. A Sprint 3.4 precisa executar o smoke autenticado; a 3.5 está bloqueada até verificação primária da coorte.": "**Em andamento.** As Sprints 3.0 a 3.4 possuem código, testes e homologação de Produção. A Sprint 3.5 continua bloqueada até a verificação primária da coorte externa.",
              "### Sprint 3.4 — Risk Lab em Produção": "### Sprint 3.4 — Risk Lab em Produção (concluída)",
              "**Aceite:** deployment `Ready`; flags explicitamente conferidas; Admin autenticado e ticker-only; casos `HCTR11`, `MCCI11`, `RBRY11`, ticker inválido, insuficiência e ambiguidade; persistência/auditoria conferidas; zero efeito no Premium e nas notificações; smoke salvo no Git.": f"**Aceite obtido:** deployment exato `{release}` em Produção; {check_count}/{check_count} checks; {case_count} casos; persistência, auditoria, locks, hashes e rate limit conferidos; zero efeito no Premium e nas notificações; evidência `{evidence_hash}` salva no Git.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Canonical handoff marker not found: {old[:80]}")
              text = text.replace(old, new, 1)

          current_section = re.compile(r"### Sprint 3\.4 — Risk Lab em Produção e smoke ponta a ponta\n.*?(?=\n## 4\.)", re.S)
          replacement_section = """### Sprint 3.5 — Coorte externa e backtest sem informação futura

          **Objetivo:** verificar a coorte pré-registrada em fontes primárias e executar o backtest sem informação futura, preservando integralmente o ruleset `v0.1.0`.

          **Trabalho obrigatório:**

          1. confirmar `knownAt`, URL, trecho, página, hash e versão por observação;
          2. executar `DEVA11`, `VSLH11`, `KNCR11`, `KNSC11`, `MCCI11` e `RBRY11` sem look-ahead;
          3. medir antecedência, falsos positivos, falsos negativos, inconclusão e cobertura;
          4. manter `executionAllowed=false` enquanto faltar verificação primária;
          5. versionar a evidência e preservar o ruleset congelado.

          **Critério de aceite:** nenhuma conclusão final sustentada apenas por fonte secundária; controles saudáveis sem vermelho injustificado; ambiguidades como inconclusivas; métricas e evidências persistidas no Git.
          """
          text, count = current_section.subn(replacement_section.rstrip(), text, count=1)
          if count != 1:
              raise SystemExit("Current Sprint 3.4 section was not replaced exactly once")

          track = re.compile(r"### Trilha principal de produto\n\n.*?(?=\n### Trilha SEO)", re.S)
          track_text = """### Trilha principal de produto

          1. **Sprint 3.5 — Coorte externa e backtest sem informação futura.**
          2. **Sprint 3.6 — Métricas, calibração e gate formal.**
          3. **Sprint 3.7 — Risk Lab read-only no Relatório Premium e Prompt Premium v3.**
          4. **Sprint 3.8 — Impacto na carteira e alertas opt-in.**
          5. **Sprint 4.1 — Radar: acompanhar fundo fora da carteira.**
          6. **Sprint 4.2 — Radar: eventos, tese e relatório pré-compra.**
          7. **Sprint 4.3 — Planos, preferências, canais e monetização.**
          8. **Sprint 5.1 — Carteira histórica verdadeira e ledger de eventos.**
          9. **Sprint 5.2 — Motor de risco, exposição e atribuição acionável.**
          10. **Sprint 5.3 — Inteligência sobre comunicados oficiais.**
          11. **Sprint 5.4 — Screener quantitativo, pares e fair value por tipo de FII.**
          12. **Sprint 5.5 — Benchmark, retorno total, calendário, centro fiscal e simuladores.**
          """
          text, count = track.subn(track_text.rstrip(), text, count=1)
          if count != 1:
              raise SystemExit("Official sprint order was not replaced exactly once")
          handoff.write_text(text)

          doc = Path("docs/risk-lab/sprint-3-4-production-smoke.md")
          content = doc.read_text()
          content += f"""

          ## Resultado de Produção

          - Status: `passed`;
          - Commit: `{release}`;
          - Checks: `{check_count}/{check_count}`;
          - Casos: `{case_count}`;
          - Hash da evidência: `{evidence_hash}`;
          - Premium integrado: `false`;
          - Notificações enviadas: `false`.
          """
          doc.write_text(content)
          PY

          rm .github/workflows/risk-lab-production-smoke.yml

      - name: Validate closure changes
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent
          npm run typecheck
          npm run test:risk-lab
          npm run test:sprint2

      - name: Push closure branch and open pull request
        id: closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/risk-lab-3-4-closure-${GITHUB_RUN_ID}"
          evidence_hash=$(jq -r '.evidence.evidenceHash' risk-lab-production-smoke-response.json)
          release_commit=$(jq -r '.evidence.releaseCommit' risk-lab-production-smoke-response.json)
          check_count=$(jq -r '.evidence.checks | length' risk-lab-production-smoke-response.json)
          case_count=$(jq -r '.evidence.cases | length' risk-lab-production-smoke-response.json)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: formaliza conclusão da Sprint 3.4"
          git push origin "$branch"

          pr_url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: formaliza conclusão da Sprint 3.4" \
            --body "## Evidência de Produção

          - release: \`${release_commit}\`
          - checks: ${check_count}/${check_count}
          - casos: ${case_count}
          - hash: \`${evidence_hash}\`
          - Premium: não integrado
          - notificações: não enviadas

          Esta PR versiona a evidência, remove o gatilho temporário, deixa a rota somente leitura e avança o handoff canônico para a Sprint 3.5.")
          pr_number="${pr_url##*/}"

          python - "$pr_number" <<'PY'
          import sys
          from pathlib import Path
          number = sys.argv[1]
          path = Path("DADOS_FII_HANDOFF.md")
          text = path.read_text()
          marker = "**PR desta atualização:** `PENDING_PR` — `chore: formaliza conclusão da Sprint 3.4`"
          replacement = f"**PR desta atualização:** #{number} — `chore: formaliza conclusão da Sprint 3.4`"
          if marker not in text:
              raise SystemExit("Pending PR marker not found")
          path.write_text(text.replace(marker, replacement, 1))
          PY
          git add DADOS_FII_HANDOFF.md
          git commit -m "docs: registra PR de encerramento da Sprint 3.4"
          git push origin "$branch"
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
          echo "Closure PR: ${pr_url}"
