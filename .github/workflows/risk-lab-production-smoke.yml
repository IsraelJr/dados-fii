name: Risk Lab Production Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/risk-lab-production-smoke.yml"
      - "src/app/api/system/risk-lab-production-smoke/**"
      - "src/lib/risk-lab/RiskLabProductionSmokeService.ts"
      - "src/lib/risk-lab/RiskLabProductionSmokeStore.ts"
      - "src/lib/risk-lab/RiskLabAutomaticOrchestrator.ts"
      - "src/lib/risk-lab/RiskLabAutomaticScanStore.ts"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: risk-lab-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_ID: risk-lab-3-4-20260720-v1
      PRODUCTION_ORIGIN: https://dadosfii.com.br
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute observable production smoke
        id: smoke
        shell: bash
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -u
          endpoint="${PRODUCTION_ORIGIN}/api/system/risk-lab-production-smoke?source=github-actions&runId=${RUN_ID}&release=${RELEASE_COMMIT}"
          response="risk-lab-production-smoke-response.json"
          : > "$response"
          observed=false
          http_code="000"

          for attempt in $(seq 1 20); do
            echo "Attempt ${attempt}/20 for release ${RELEASE_COMMIT}"
            http_code=$(curl --silent --show-error --location \
              --max-time 320 \
              --output "$response" \
              --write-out "%{http_code}" \
              "$endpoint" || true)

            if [[ "$http_code" == "200" || "$http_code" == "422" ]]; then
              observed=true
              break
            fi

            if [[ "$http_code" != "409" && "$http_code" != "000" && "$http_code" != "503" ]]; then
              observed=true
              break
            fi
            sleep 15
          done

          if ! jq empty "$response" >/dev/null 2>&1; then
            jq -n \
              --arg status "transport_failure" \
              --arg httpCode "$http_code" \
              --arg release "$RELEASE_COMMIT" \
              --argjson observed "$observed" \
              '{ok:false,status:$status,httpCode:$httpCode,releaseCommit:$release,observed:$observed}' > "$response"
          fi

          status=$(jq -r '.status // "unknown"' "$response")
          passed=false
          if [[ "$http_code" == "200" && "$status" == "passed" ]]; then
            passed=true
          fi

          echo "http_code=${http_code}" >> "$GITHUB_OUTPUT"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "passed=${passed}" >> "$GITHUB_OUTPUT"
          echo "Smoke response: HTTP ${http_code}, status ${status}, passed ${passed}."

      - name: Upload sanitized smoke response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-lab-production-smoke-${{ github.sha }}
          path: risk-lab-production-smoke-response.json
          if-no-files-found: error
          retention-days: 30

      - name: Version observable result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PASSED: ${{ steps.smoke.outputs.passed }}
          STATUS: ${{ steps.smoke.outputs.status }}
          HTTP_CODE: ${{ steps.smoke.outputs.http_code }}
        run: |
          set -euo pipefail
          result_dir="docs/production-evidence/risk-lab"
          branch="automation/risk-lab-3-4-result-${GITHUB_RUN_ID}"
          mkdir -p "$result_dir"

          if [[ "$PASSED" == "true" ]] && jq -e '.evidence.status == "passed" and (.evidence.evidenceHash | length == 64)' risk-lab-production-smoke-response.json >/dev/null; then
            result_path="${result_dir}/${RUN_ID}.json"
            jq '.evidence' risk-lab-production-smoke-response.json > "$result_path"
            title="chore: formaliza conclusão da Sprint 3.4"
            commit_message="docs: versiona evidência aprovada da Sprint 3.4"
          else
            result_path="${result_dir}/diagnostic-${GITHUB_SHA}.json"
            jq '.' risk-lab-production-smoke-response.json > "$result_path"
            title="fix: registra bloqueio do smoke da Sprint 3.4"
            commit_message="docs: registra diagnóstico do smoke da Sprint 3.4"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$result_path"
          git commit -m "$commit_message"
          git push origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "$title" \
            --body "## Resultado automatizado do smoke

          - status: \`${STATUS}\`
          - HTTP: \`${HTTP_CODE}\`
          - commit solicitado: \`${GITHUB_SHA}\`
          - arquivo: \`${result_path}\`

          A branch foi criada mesmo em caso de reprovação para permitir diagnóstico e correção sem ação manual do proprietário." \
            || echo "A branch de resultado foi criada; a abertura automática da PR não foi autorizada pelo repositório."

      - name: Enforce smoke result
        if: always()
        shell: bash
        env:
          PASSED: ${{ steps.smoke.outputs.passed }}
        run: |
          if [[ "$PASSED" != "true" ]]; then
            echo "Sprint 3.4 production smoke did not pass."
            exit 1
          fi
