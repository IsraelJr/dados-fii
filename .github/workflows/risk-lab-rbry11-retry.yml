name: Materialize RBRY11 Final Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/risk-lab-rbry11-retry.yml"
      - ".tmp/rbry-bundle-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/sprint-3-5-b5-rbry11' || github.ref_name == 'agent/sprint-3-5-b5-rbry11'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/sprint-3-5-b5-rbry11
          fetch-depth: 0

      - name: Recover unique transport byte and verify final bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          path = Path('.tmp/rbry-bundle-01')
          data = bytearray(path.read_bytes())
          target = '57add64f381c1e1889c8f70ec7d87b467deedba4b3f3081db934054d32f2406a'
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
          matches = []
          for index, original in enumerate(data):
              for candidate in alphabet:
                  if candidate == original:
                      continue
                  data[index] = candidate
                  if sha256(data).hexdigest() == target:
                      matches.append((index, original, candidate, bytes(data)))
                  data[index] = original
          if len(matches) != 1:
              raise SystemExit(f'Esperada uma correção única; encontradas {len(matches)}.')
          index, original, candidate, corrected = matches[0]
          path.write_bytes(corrected)
          print(f'Correção única aplicada no byte {index}: {chr(original)} -> {chr(candidate)}')
          PY
          echo "a68cef8147eae4165fdd55e4c4a3b0ad63855364d281d2c8ccf30879239708cd  .tmp/rbry-bundle-00" | sha256sum -c -
          echo "57add64f381c1e1889c8f70ec7d87b467deedba4b3f3081db934054d32f2406a  .tmp/rbry-bundle-01" | sha256sum -c -
          echo "accdc2075db47b2e4c4132a269b168e517a86b729f8e4ec427d9f2ed7a48dce2  .tmp/rbry-bundle-02" | sha256sum -c -
          echo "a36b53a3d0bd7f2d3a77a7813c53578c741f23c5aaea123b9667de0b774264e6  .tmp/rbry-bundle-03" | sha256sum -c -
          echo "dab1bfa6ec0570c6239483524c7a7c76ff35c1a34c9ceeb9dc5c6d0f071c9268  .tmp/rbry-bundle-04" | sha256sum -c -
          cat .tmp/rbry-bundle-00 .tmp/rbry-bundle-01 .tmp/rbry-bundle-02 .tmp/rbry-bundle-03 .tmp/rbry-bundle-04 > .tmp/rbry-final.tar.gz.b64
          echo "2c107e1988d9b3615c8698f0592e3a13313ab2b7589d6c63efb68616f59646f7  .tmp/rbry-final.tar.gz.b64" | sha256sum -c -
          base64 --decode .tmp/rbry-final.tar.gz.b64 > .tmp/rbry-final.tar.gz
          echo "935a9c282b64665b39518fc5065ad8ec926f8cc1a08bd726a0cd95c27c8c4d15  .tmp/rbry-final.tar.gz" | sha256sum -c -
          tar -xzf .tmp/rbry-final.tar.gz -C .

      - name: Remove temporary transport and collection files
        shell: bash
        run: |
          rm -f scripts/risk-lab-retry-rbry11.mjs
          rm -f .tmp/rbry-bundle-00 .tmp/rbry-bundle-01 .tmp/rbry-bundle-02 .tmp/rbry-bundle-03 .tmp/rbry-bundle-04
          rm -f .tmp/rbry-final.tar.gz .tmp/rbry-final.tar.gz.b64

      - name: Commit permanent deterministic files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "data: publica evidência final do RBRY11"
          git push origin HEAD:agent/sprint-3-5-b5-rbry11
