name: Diagnose RBRY11 Bundle Parts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/risk-lab-rbry11-retry.yml"
      - ".tmp/rbry-bundle-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/sprint-3-5-b5-rbry11' || github.ref_name == 'agent/sprint-3-5-b5-rbry11'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/sprint-3-5-b5-rbry11

      - name: Record actual hashes and sizes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/diagnostic
          sha256sum .tmp/rbry-bundle-00 .tmp/rbry-bundle-01 .tmp/rbry-bundle-02 .tmp/rbry-bundle-03 .tmp/rbry-bundle-04 > .tmp/diagnostic/hashes.txt
          wc -c .tmp/rbry-bundle-00 .tmp/rbry-bundle-01 .tmp/rbry-bundle-02 .tmp/rbry-bundle-03 .tmp/rbry-bundle-04 > .tmp/diagnostic/sizes.txt
          cat .tmp/rbry-bundle-00 .tmp/rbry-bundle-01 .tmp/rbry-bundle-02 .tmp/rbry-bundle-03 .tmp/rbry-bundle-04 > .tmp/diagnostic/combined.b64
          sha256sum .tmp/diagnostic/combined.b64 > .tmp/diagnostic/combined-hash.txt
          cat .tmp/diagnostic/hashes.txt .tmp/diagnostic/sizes.txt .tmp/diagnostic/combined-hash.txt

      - name: Upload transport diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: rbry11-bundle-transport-${{ github.run_id }}
          path: .tmp/diagnostic
          if-no-files-found: error
          retention-days: 1
