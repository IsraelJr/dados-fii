name: RBRY11 Official Retry

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/risk-lab-rbry11-retry.yml"
      - "scripts/risk-lab-retry-rbry11.mjs"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frozen dependencies
        run: npm ci --silent

      - name: Download immutable diagnostic artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/source
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8515476365/zip" \
            > .tmp/source/artifact.zip
          echo "8ed76121aa14086cba740ad921cdcef925e44bd274cb86ca42bc14bba1ee9d0e  .tmp/source/artifact.zip" | sha256sum -c -
          unzip -q .tmp/source/artifact.zip -d .tmp/source/unpacked

      - name: Retry RBRY11 official pending document
        run: |
          set -euo pipefail
          node --import ./tests/register-ts-loader.mjs --experimental-strip-types \
            scripts/risk-lab-retry-rbry11.mjs \
            .tmp/source/unpacked/.tmp/risk-lab-dividend-notices-checkpoint.json \
            .tmp/source/unpacked/.tmp/risk-lab-cohort-identities.json \
            .tmp/rbry11-retry | tee .tmp/rbry11-retry.log

      - name: Upload official retry evidence
        uses: actions/upload-artifact@v4
        with:
          name: rbry11-official-retry-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/rbry11-retry/checkpoint.json
            .tmp/rbry11-retry/case.json
            .tmp/rbry11-retry/observation-987180.json
            .tmp/rbry11-retry.log
          if-no-files-found: error
          retention-days: 7
