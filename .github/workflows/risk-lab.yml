name: Risk Lab CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/risk-lab.yml"
      - "src/app/admin/risk-lab/**"
      - "src/app/api/admin/system/risk-lab/**"
      - "src/app/api/system/risk-lab-*/**"
      - "src/lib/risk-lab/**"
      - "src/lib/featureFlags.ts"
      - "src/types/riskLab*.ts"
      - "tests/risk-lab-*.test.ts"
      - "tests/risk-lab-*.test.mjs"
      - "docs/production-evidence/risk-lab/**"
      - "docs/risk-lab/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: risk-lab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frozen dependencies
        run: npm ci --silent

      # O typecheck e a governança dos workflows pertencem à CI central.
      # Esta verificação executa a suíte especializada e mantém diagnóstico local do build.
      - name: Run Risk Lab tests
        id: risk_lab_tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .tmp
          npm run test:risk-lab 2>&1 | tee .tmp/risk-lab-ci.log

      - name: Validate deterministic DEVA11 phase
        id: deva11_tests
        shell: bash
        run: |
          set -o pipefail
          node --import ./tests/register-ts-loader.mjs --experimental-strip-types --test \
            tests/risk-lab-deva11-phase-a.test.ts \
            tests/risk-lab-deva11-evidence.test.mjs 2>&1 | tee .tmp/deva11-ci.log

      - name: Validate deterministic VSLH11 phase
        id: vslh11_tests
        shell: bash
        run: |
          set -o pipefail
          node --import ./tests/register-ts-loader.mjs --experimental-strip-types --test \
            tests/risk-lab-frozen-dividend-checkpoint-reconciler.test.ts \
            tests/risk-lab-vslh11-evidence.test.mjs 2>&1 | tee .tmp/vslh11-ci.log

      - name: Validate deterministic KNCR11 phase
        id: kncr11_tests
        shell: bash
        run: |
          set -o pipefail
          node --import ./tests/register-ts-loader.mjs --experimental-strip-types --test \
            tests/risk-lab-frozen-dividend-checkpoint-reconciler.test.ts \
            tests/risk-lab-kncr11-evidence.test.mjs 2>&1 | tee .tmp/kncr11-ci.log

      - name: Validate deterministic KNSC11 phase
        id: knsc11_tests
        shell: bash
        run: |
          set -o pipefail
          node --import ./tests/register-ts-loader.mjs --experimental-strip-types --test \
            tests/risk-lab-deva11-phase-a.test.ts \
            tests/risk-lab-knsc11-evidence.test.mjs 2>&1 | tee .tmp/knsc11-ci.log

      - name: Validate deterministic MCCI11 phase
        id: mcci11_tests
        shell: bash
        run: |
          set -o pipefail
          node --import ./tests/register-ts-loader.mjs --experimental-strip-types --test \
            tests/risk-lab-frozen-dividend-observation-window-sanitizer.test.ts \
            tests/risk-lab-deva11-phase-a.test.ts \
            tests/risk-lab-mcci11-evidence.test.mjs 2>&1 | tee .tmp/mcci11-ci.log

      - name: Validate deterministic RBRY11 phase
        id: rbry11_tests
        shell: bash
        run: |
          set -o pipefail
          node --import ./tests/register-ts-loader.mjs --experimental-strip-types --test \
            tests/risk-lab-frozen-dividend-retry-checkpoint-auditor.test.ts \
            tests/risk-lab-frozen-dividend-observation-window-sanitizer.test.ts \
            tests/risk-lab-deva11-phase-a.test.ts \
            tests/risk-lab-rbry11-evidence.test.mjs 2>&1 | tee .tmp/rbry11-ci.log

      - name: Validate immutable cohort dataset and no-look-ahead backtest
        id: phase_c_tests
        shell: bash
        run: |
          set -o pipefail
          node --import ./tests/register-ts-loader.mjs --experimental-strip-types --test \
            tests/risk-lab-frozen-cohort-phase-c.test.ts \
            tests/risk-lab-cohort-phase-c-evidence.test.mjs 2>&1 | tee .tmp/phase-c-ci.log

      - name: Validate calibrated and homologated Risk Lab ruleset
        id: phase_3_6_tests
        shell: bash
        run: |
          set -o pipefail
          node --import ./tests/register-ts-loader.mjs --experimental-strip-types --test \
            tests/risk-lab-calibration-phase-3-6.test.ts \
            tests/risk-lab-calibration-phase-3-6-evidence.test.mjs 2>&1 | tee .tmp/phase-3-6-ci.log

      - name: Validate TypeScript diagnostics
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee .tmp/typecheck.log

      # Gera uma credencial descartável somente no runner. Nenhuma credencial real
      # é copiada ao GitHub e o código de produção permanece inalterado.
      - name: Prepare build-only Firebase credentials
        id: build_firebase_credentials
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const { generateKeyPairSync } = require("node:crypto");
          const { appendFileSync } = require("node:fs");

          const { privateKey } = generateKeyPairSync("rsa", {
            modulusLength: 2048,
            publicKeyEncoding: { type: "spki", format: "pem" },
            privateKeyEncoding: { type: "pkcs8", format: "pem" },
          });

          const serviceAccount = {
            type: "service_account",
            project_id: "dados-fii-build",
            private_key_id: "build-only",
            private_key: privateKey,
            client_email: "build-only@dados-fii-build.iam.gserviceaccount.com",
            client_id: "000000000000000000000",
            auth_uri: "https://accounts.google.com/o/oauth2/auth",
            token_uri: "https://oauth2.googleapis.com/token",
            auth_provider_x509_cert_url: "https://www.googleapis.com/oauth2/v1/certs",
            client_x509_cert_url: "https://www.googleapis.com/robot/v1/metadata/x509/build-only%40dados-fii-build.iam.gserviceaccount.com",
          };

          appendFileSync(
            process.env.GITHUB_ENV,
            `FIREBASE_SERVICE_ACCOUNT_KEY<<FIREBASE_BUILD_EOF\n${JSON.stringify(serviceAccount)}\nFIREBASE_BUILD_EOF\n`,
          );
          NODE

      # Fallback automatizado para indisponibilidade externa do Preview Vercel.
      # Mantém o gate de build sem depender de cota, ação manual ou plano pago.
      - name: Validate production build
        id: production_build
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "dados-fii-build.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "dados-fii-build"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "dados-fii-build.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: "G-0000000000"
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .tmp/production-build.log

      - name: Upload failure diagnostics
        if: failure() && (steps.risk_lab_tests.outcome == 'failure' || steps.deva11_tests.outcome == 'failure' || steps.vslh11_tests.outcome == 'failure' || steps.kncr11_tests.outcome == 'failure' || steps.knsc11_tests.outcome == 'failure' || steps.mcci11_tests.outcome == 'failure' || steps.rbry11_tests.outcome == 'failure' || steps.phase_c_tests.outcome == 'failure' || steps.phase_3_6_tests.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.build_firebase_credentials.outcome == 'failure' || steps.production_build.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: risk-lab-ci-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/risk-lab-ci.log
            .tmp/deva11-ci.log
            .tmp/vslh11-ci.log
            .tmp/kncr11-ci.log
            .tmp/knsc11-ci.log
            .tmp/mcci11-ci.log
            .tmp/rbry11-ci.log
            .tmp/phase-c-ci.log
            .tmp/phase-3-6-ci.log
            .tmp/typecheck.log
            .tmp/production-build.log
          if-no-files-found: error
          retention-days: 3
