name: Risk Lab CI

on:
  pull_request:
    paths:
      - ".github/workflows/risk-lab.yml"
      - "docs/risk-lab/**"
      - "src/lib/risk-lab/**"
      - "src/types/riskLab.ts"
      - "tests/risk-lab-*.test.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/risk-lab.yml"
      - "docs/risk-lab/**"
      - "src/lib/risk-lab/**"
      - "src/types/riskLab.ts"
      - "tests/risk-lab-*.test.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: risk-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --silent

      - name: Typecheck
        run: npm run typecheck

      - name: Run Risk Lab tests
        run: npm run test:risk-lab
