name: Risk Lab CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/risk-lab.yml"
      - "src/app/admin/risk-lab/**"
      - "src/app/api/admin/system/risk-lab/**"
      - "src/app/api/system/risk-lab-*/**"
      - "src/lib/risk-lab/**"
      - "src/lib/featureFlags.ts"
      - "src/types/riskLab*.ts"
      - "tests/risk-lab-*.test.ts"
      - "tests/risk-lab-*.test.mjs"
      - "docs/production-evidence/risk-lab/**"
      - "docs/risk-lab/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: risk-lab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frozen dependencies
        run: npm ci --silent

      # O typecheck e a governança dos workflows pertencem à CI central.
      # Esta verificação executa somente a suíte especializada do domínio.
      - name: Run Risk Lab tests
        id: risk_lab_tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .tmp
          npm run test:risk-lab 2>&1 | tee .tmp/risk-lab-ci.log

      - name: Validate deterministic DEVA11 phase
        run: >-
          node --import ./tests/register-ts-loader.mjs --experimental-strip-types --test
          tests/risk-lab-deva11-phase-a.test.ts
          tests/risk-lab-deva11-evidence.test.mjs

      - name: Upload failure diagnostics
        if: failure() && steps.risk_lab_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: risk-lab-ci-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/risk-lab-ci.log
          if-no-files-found: error
          retention-days: 3
