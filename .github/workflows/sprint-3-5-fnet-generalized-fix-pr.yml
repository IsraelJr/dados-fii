name: Sprint 3.5 Generalized FNET Fix PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sprint-3-5-fnet-generalized-fix-pr.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Execute tested patch embedded in the temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/sprint-3-5-fnet-generalized-fix.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          script = source[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script.splitlines())
          exec(compile(script, 'sprint-3-5-fnet-generalized-fix', 'exec'))
          Path('.github/workflows/sprint-3-5-fnet-generalized-fix-pr.yml').unlink()
          PY

      - run: npm run typecheck
      - run: npm run test:sprint3.5
      - run: npm run test:sprint2

      - name: Commit tested corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normaliza avisos multiclasse e reapresentações FNET"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
