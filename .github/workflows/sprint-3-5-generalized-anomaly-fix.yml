name: Sprint 3.5 Generalized FNET Anomaly Fix

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-validate:
    if: github.head_ref == 'automation/sprint-3-5-collector-timeout-contingency'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply generalized temporal fixes and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          parser = "src/lib/risk-lab/FnetDividendNoticeParser.ts"
          replace_once(
              parser,
              '''function normalizeTemporalCompetence(value: string, informationDate: string, raw: string) {
            const informationMonth = informationDate.slice(0, 7);
            if (value <= informationMonth) return value;

            const [year, month] = value.split("-").map(Number);
            const [informationYear, informationMonthNumber] = informationMonth.split("-").map(Number);
            if (year === informationYear && month === 12 && informationMonthNumber === 1) {
              return `${year - 1}-12`;
            }
            throw new Error(`Período de referência FNET posterior à informação: ${raw}`);
          }

          function parseCompetence(value: string, informationDate: string) {''',
              '''function normalizeTemporalCompetence(value: string, temporalAnchorDate: string, raw: string) {
            const temporalAnchorMonth = temporalAnchorDate.slice(0, 7);
            if (value <= temporalAnchorMonth) return value;

            const [year, month] = value.split("-").map(Number);
            const [anchorYear, anchorMonthNumber] = temporalAnchorMonth.split("-").map(Number);
            if (year === anchorYear && month === 12 && anchorMonthNumber === 1) {
              return `${year - 1}-12`;
            }
            throw new Error(`Período de referência FNET posterior às datas do aviso: ${raw}`);
          }

          function parseCompetence(value: string, temporalAnchorDate: string) {''',
          )
          text = Path(parser).read_text(encoding="utf-8")
          text = text.replace("informationDate,\n      raw,", "temporalAnchorDate,\n      raw,")
          text = text.replace("informationDate, raw", "temporalAnchorDate, raw")
          text = text.replace("informationDate.slice(0, 4)", "temporalAnchorDate.slice(0, 4)")
          text = text.replace("informationDate, raw);", "temporalAnchorDate, raw);")
          Path(parser).write_text(text, encoding="utf-8")
          replace_once(
              parser,
              '''  const informationDate = parseBrazilianDate(field(allCells, ["Data da Informação:", "Data da informação"]));
            const periodReferenceRaw = field(allCells, ["Período de referência"]);''',
              '''  const informationDate = parseBrazilianDate(field(allCells, ["Data da Informação:", "Data da informação"]));
            const baseDate = parseBrazilianDate(field(allCells, ["Data-base (último dia de negociação “com” direito ao provento)", "Data-base (último dia de negociação com direito ao provento)"]));
            const temporalAnchorDate = baseDate > informationDate ? baseDate : informationDate;
            const periodReferenceRaw = field(allCells, ["Período de referência"]);''',
          )
          replace_once(
              parser,
              '''    baseDate: parseBrazilianDate(field(allCells, ["Data-base (último dia de negociação “com” direito ao provento)", "Data-base (último dia de negociação com direito ao provento)"])),
              paymentDate: parseBrazilianDate(field(allCells, ["Data do pagamento"])),
              competenceMonth: parseCompetence(periodReferenceRaw, informationDate),''',
              '''    baseDate,
              paymentDate: parseBrazilianDate(field(allCells, ["Data do pagamento"])),
              competenceMonth: parseCompetence(periodReferenceRaw, temporalAnchorDate),''',
          )

          collector = "src/lib/risk-lab/FrozenDividendNoticeCollector.ts"
          old_window = '''    const competence = monthIndex(notice.competenceMonth);
              const firstMonth = monthIndex(identity.fromDate.slice(0, 7));
              const lastMonth = monthIndex(identity.untilDate.slice(0, 7));
              if (competence < firstMonth || competence > lastMonth) return null;

          '''
          collector_text = Path(collector).read_text(encoding="utf-8")
          if collector_text.count(old_window) != 1:
              raise SystemExit(f"Expected one competence window block, found {collector_text.count(old_window)}")
          collector_text = collector_text.replace(old_window, "", 1)
          insertion = '''    if (!(notice.amountPerShare > 0)) {
              throw new Error(`Valor anunciado não positivo no aviso ${document.documentId}.`);
            }
          '''
          replacement = insertion + '''
            // Documentos cuja competência está fora da coorte não participam da série
            // congelada. Eles são descartados antes de validar metadados históricos que
            // podem conter erros oficiais sem efeito econômico dentro da janela analisada.
            const competence = monthIndex(notice.competenceMonth);
            const firstMonth = monthIndex(identity.fromDate.slice(0, 7));
            const lastMonth = monthIndex(identity.untilDate.slice(0, 7));
            if (competence < firstMonth || competence > lastMonth) return null;
          '''
          if replacement not in collector_text:
              if collector_text.count(insertion) != 1:
                  raise SystemExit("Collector insertion anchor not found exactly once")
              collector_text = collector_text.replace(insertion, replacement, 1)
          Path(collector).write_text(collector_text, encoding="utf-8")

          parser_tests = "tests/risk-lab-fnet-notice-parser.test.ts"
          parser_test_text = Path(parser_tests).read_text(encoding="utf-8")
          marker = 'test("usa a data-base como limite temporal quando a data da informação está defasada"'
          if marker not in parser_test_text:
              parser_test_text += '''

          test("usa a data-base como limite temporal quando a data da informação está defasada", () => {
            const notice = table([
              ["Nome do Fundo:", "FUNDO DE INVESTIMENTO IMOBILIÁRIO KINEA RENDIMENTOS"],
              ["Data da Informação:", "31/03/2023"],
              ["Código de negociação:", "KNCR11"],
              ["Data-base (último dia de negociação “com” direito ao provento)", "28/04/2023"],
              ["Valor do provento (R$/unidade)", "1,00"],
              ["Data do pagamento", "12/05/2023"],
              ["Período de referência", "Abril 2023"],
              ["Rendimento isento de IR*", "Sim"],
            ]);
            const parsed = parseFnetDividendNoticeHtml(notice);
            assert.equal(parsed.informationDate, "2023-03-31");
            assert.equal(parsed.baseDate, "2023-04-28");
            assert.equal(parsed.competenceMonth, "2023-04");
          });

          test("continua rejeitando competência posterior tanto à informação quanto à data-base", () => {
            const invalid = currentNotice.replace("Junho-2026", "Agosto-2026");
            assert.throws(() => parseFnetDividendNoticeHtml(invalid), /posterior às datas do aviso/);
          });
          '''
              Path(parser_tests).write_text(parser_test_text, encoding="utf-8")

          collector_tests = "tests/risk-lab-frozen-dividend-collector.test.ts"
          collector_test_text = Path(collector_tests).read_text(encoding="utf-8")
          marker = 'test("ignora anomalia histórica de protocolo quando a competência está fora da coorte"'
          if marker not in collector_test_text:
              collector_test_text += '''

          test("ignora anomalia histórica de protocolo quando a competência está fora da coorte", async () => {
            const targetIdentities = identities();
            const documentsByCnpj = new Map<string, FnetDividendDocumentEvidence[]>();
            const htmlById = new Map<string, string>();

            targetIdentities.forEach((identity, index) => {
              const current = document(String(3000 + index * 10));
              documentsByCnpj.set(identity.cnpj, [current]);
              htmlById.set(current.documentId, notice(identity.ticker));
            });

            const first = targetIdentities[0];
            const historical = document("3999");
            historical.protocolMetadata.referenceDate = "2021-01-31";
            documentsByCnpj.set(first.cnpj, [historical, ...documentsByCnpj.get(first.cnpj)!]);
            htmlById.set("3999", notice(first.ticker).replace("01-2022", "12-2021"));

            const collector = new FrozenDividendNoticeCollector({
              attempts: 1,
              now: () => new Date("2026-07-22T03:00:00-03:00"),
              discovery: {
                async discover(cnpj: string) {
                  const documents = documentsByCnpj.get(cnpj);
                  assert.ok(documents);
                  return {
                    internalFundId: cnpj,
                    documents,
                    recordsInspected: documents.length,
                    sourceUrl: "https://fnet.bmfbovespa.com.br/fnet/publico/pesquisarGerenciadorDocumentosDados",
                  };
                },
              },
              fetchImpl: (async (input: string | URL | Request) => {
                const id = new URL(String(input)).searchParams.get("id") || "";
                const html = htmlById.get(id);
                assert.ok(html);
                return new Response(html, { status: 200, headers: { "content-type": "text/html" } });
              }) as typeof fetch,
            });

            const result = await collector.collect(targetIdentities, RELEASE, null, async () => undefined);
            assert.equal(result.dataset.status, "complete");
            assert.equal(result.dataset.cases[0].documentsProcessed, 2);
            assert.equal(result.dataset.cases[0].pendingDocumentIds.length, 0);
            assert.equal(result.dataset.cases[0].observations.length, 1);
          });
          '''
              Path(collector_tests).write_text(collector_test_text, encoding="utf-8")

          workflow = ".github/workflows/risk-lab-frozen-dividend-notices.yml"
          replace_once(workflow, "    timeout-minutes: 60\n", "    timeout-minutes: 120\n")

          architecture_test = "tests/risk-lab-frozen-dividend-architecture.test.mjs"
          architecture_text = Path(architecture_test).read_text(encoding="utf-8")
          anchor = '  assert.match(workflow, /actions\\/upload-artifact@v4/);\n'
          addition = anchor + '  assert.match(workflow, /timeout-minutes:\\s*120/);\n'
          if addition not in architecture_text:
              if architecture_text.count(anchor) != 1:
                  raise SystemExit("Architecture test anchor not found exactly once")
              architecture_text = architecture_text.replace(anchor, addition, 1)
              Path(architecture_test).write_text(architecture_text, encoding="utf-8")

          Path(".github/workflows/sprint-3-5-generalized-anomaly-fix.yml").unlink()
          PY

      - name: Validate generalized fix
        run: |
          npm install --silent
          npm run typecheck
          npm run test:risk-lab
          npm run test:sprint2

      - name: Commit generalized fix to pull request branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes remained to commit."
            exit 0
          fi
          git commit -m "fix: generaliza anomalias temporais da coleta FNET"
          git push origin "HEAD:${{ github.head_ref }}"
