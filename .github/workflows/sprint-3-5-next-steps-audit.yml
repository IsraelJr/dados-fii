name: Sprint 3.5 Next Steps Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sprint-3-5-next-steps-audit.yml

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_ORIGIN: https://dadosfii.com.br
    steps:
      - uses: actions/checkout@v4

      - name: Collect raw production and workflow evidence
        shell: bash
        run: |
          set -u
          mkdir -p audit
          date -u +'%Y-%m-%dT%H:%M:%SZ' > audit/audited-at.txt

          gh api "repos/${GITHUB_REPOSITORY}/commits/main" \
            > audit/main-commit.json 2> audit/main-commit.err || true

          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/risk-lab-frozen-dividend-notices.yml/runs?branch=main&per_page=20" \
            > audit/frozen-runs.json 2> audit/frozen-runs.err || true
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/risk-lab-cohort-backtest.yml/runs?branch=main&per_page=20" \
            > audit/backtest-runs.json 2> audit/backtest-runs.err || true
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/risk-lab-cohort-deploy-recovery.yml/runs?branch=main&per_page=20" \
            > audit/recovery-runs.json 2> audit/recovery-runs.err || true

          curl --silent --show-error --location --max-time 45 \
            --dump-header audit/production-headers.txt \
            --output audit/production-response.txt \
            --write-out '%{http_code}' \
            "${PRODUCTION_ORIGIN}/api/system/risk-lab-cohort-backtest" \
            > audit/production-http-code.txt 2> audit/production-curl.err || true

          gh api -X GET search/issues \
            -f q="repo:${GITHUB_REPOSITORY} is:pr is:open" \
            -f per_page=100 \
            > audit/open-prs.json 2> audit/open-prs.err || true

          for file in audit/*.json; do
            if [[ -s "$file" ]] && jq empty "$file" >/dev/null 2>&1; then
              jq . "$file" > "${file%.json}.pretty.json"
            fi
          done

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-3-5-next-steps-audit
          path: audit
          if-no-files-found: error
          retention-days: 7
