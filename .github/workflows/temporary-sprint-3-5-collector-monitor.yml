name: Temporary Sprint 3.5 Collector Monitor

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-sprint-3-5-collector-monitor.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect collector run and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 8ba771652787ff6ac34aaf00b003012ce6aa60dc
        run: |
          set -euo pipefail
          mkdir -p monitor
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/risk-lab-frozen-dividend-notices.yml/runs?per_page=20" > monitor/workflow-runs.json
          jq --arg sha "$TARGET_SHA" '{
            targetSha: $sha,
            runs: [.workflow_runs[] | select(.head_sha == $sha) | {
              id,
              name,
              event,
              status,
              conclusion,
              run_number,
              run_attempt,
              created_at,
              updated_at,
              html_url,
              jobs_url,
              artifacts_url
            }]
          }' monitor/workflow-runs.json > monitor/target-run.json
          run_id=$(jq -r '.runs[0].id // empty' monitor/target-run.json)
          if [[ -n "$run_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > monitor/jobs.json
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > monitor/artifacts.json
          fi
          cat monitor/target-run.json

      - name: Probe one real notice and protocol
        shell: bash
        run: |
          set -euo pipefail
          origin="https://fnet.bmfbovespa.com.br"
          user_agent='DadosFII-RiskLab-Diagnostic/1.0'
          probe() {
            local name="$1"
            local url="$2"
            curl --silent --show-error --location --max-time 60 \
              -H 'Accept: text/html,application/xhtml+xml' \
              -H 'Referer: https://fnet.bmfbovespa.com.br/fnet/publico/abrirGerenciadorDocumentosCVM' \
              -H "User-Agent: ${user_agent}" \
              -D "monitor/${name}.headers" \
              -o "monitor/${name}.html" \
              -w '{"httpCode":%{http_code},"seconds":%{time_total},"bytes":%{size_download},"contentType":"%{content_type}","redirects":%{num_redirects}}\n' \
              "$url" > "monitor/${name}.metrics.json"
          }
          probe notice "$origin/fnet/publico/exibirDocumento?id=261398&cvm=true"
          probe protocol "$origin/fnet/publico/visualizarProtocoloDocumentoCVM?idDocumento=261398"
          cat monitor/notice.metrics.json
          cat monitor/protocol.metrics.json

      - name: Upload monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-sprint-3-5-collector-monitor
          path: monitor
          retention-days: 1
