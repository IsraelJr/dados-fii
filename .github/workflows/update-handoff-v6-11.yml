name: Update Canonical Handoff v6.11

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/update-handoff-v6-11.yml"
      - ".tmp/update-handoff-v6-11.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'docs/handoff-v6-11-phase-c' || github.ref_name == 'docs/handoff-v6-11-phase-c'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/handoff-v6-11-phase-c
          fetch-depth: 0
      - name: Generate canonical Handoff and test
        id: generate
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .tmp
          python - <<'PY'
          from pathlib import Path
          path = Path('.tmp/update-handoff-v6-11.mjs')
          text = path.read_text()
          old = 'function escapeRegExp(value) { return value.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&"); }'
          new = 'function escapeRegExp(value) { return value.replace(/[-/\\\\^$*+?.()|[\\]{}]/g, "\\\\$&"); }'
          if old not in text:
              raise SystemExit('Linha esperada de escapeRegExp não encontrada.')
          path.write_text(text.replace(old, new))
          PY
          node .tmp/update-handoff-v6-11.mjs 2>&1 | tee .tmp/handoff-generation.log
      - name: Upload generation diagnostic
        if: failure() && steps.generate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: handoff-v6-11-generation-failure-${{ github.run_id }}
          path: .tmp/handoff-generation.log
          if-no-files-found: error
          retention-days: 1
      - name: Commit canonical files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DADOS_FII_HANDOFF.md tests/canonical-handoff.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "docs: atualiza Handoff canônico para v6.11.0"
          git push origin HEAD:docs/handoff-v6-11-phase-c
