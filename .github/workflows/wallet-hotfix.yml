name: Wallet Hotfix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wallet-hotfix.yml'

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply wallet page fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/carteira/page.tsx')
          text = path.read_text()

          text = text.replace(
              '<span className="ml-2 text-sm font-medium text-gray-300">{MONTHS_PTBR[payment.month] || payment.month} · Pagamento em {payment.date}</span>',
              '<span className="ml-2 text-sm font-medium text-gray-300">Pagamento em {payment.date}</span>'
          )

          text = re.sub(
              r'\nfunction MobileHistoryList\([\s\S]*?\n}\n\nfunction HistoryLineChart',
              '\nfunction HistoryLineChart',
              text,
              count=1,
          )

          text = text.replace(
              '      <MobileHistoryList snapshots={snapshots} getValue={getValue} />\n      <div className="hidden max-w-full overflow-x-auto md:block">',
              '      <div className="max-w-full overflow-x-auto">'
          )

          path.write_text(text)
          PY

      - name: Commit hotfix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wallet-hotfix.yml
          git add src/app/carteira/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix wallet mobile history chart"
          git push
