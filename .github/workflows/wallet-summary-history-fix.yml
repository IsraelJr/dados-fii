name: Wallet Historical Summary Fix

# trigger: historical-dividend-summary

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wallet-summary-history-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace summary calculation with saved snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/carteira/page.tsx')
          text = path.read_text()

          text = text.replace(
              '<SimpleMonthlySummary insights={insights} topWeight={topWeight} topWeightPercent={topWeightPercent} />',
              '<SimpleMonthlySummary snapshots={snapshots} insights={insights} topWeight={topWeight} topWeightPercent={topWeightPercent} />'
          )

          replacement = r'''function SimpleMonthlySummary({ snapshots, insights, topWeight, topWeightPercent }: { snapshots: WalletSnapshot[]; insights: WalletInsights; topWeight?: EnrichedFii; topWeightPercent: number }) {
  const currentYear = new Date().getFullYear();
  const historicalMonths = snapshots
    .filter((item) => Number(item.estimatedMonthlyIncome) > 0)
    .map((item) => ({ ...item, income: Number(item.estimatedMonthlyIncome) }))
    .sort((a, b) => a.monthKey.localeCompare(b.monthKey));
  const currentYearMonths = historicalMonths.filter((item) => getSnapshotYear(item) === currentYear);

  const currentBest = [...currentYearMonths].sort((a, b) => b.income - a.income)[0] || null;
  const currentWorst = [...currentYearMonths].sort((a, b) => a.income - b.income)[0] || null;
  const historicalBest = [...historicalMonths].sort((a, b) => b.income - a.income)[0] || null;
  const historicalWorst = [...historicalMonths].sort((a, b) => a.income - b.income)[0] || null;
  const currentYearTotal = currentYearMonths.reduce((sum, item) => sum + item.income, 0);
  const currentYearAverage = currentYearMonths.length ? currentYearTotal / currentYearMonths.length : 0;

  return (
    <section className="mt-6 rounded-2xl bg-white p-5 text-slate-800 shadow-sm ring-1 ring-slate-200">
      <div>
        <p className="inline-flex items-center gap-2 rounded-full bg-indigo-50 px-3 py-1 text-xs font-extrabold uppercase tracking-wide text-indigo-700"><BarChart3 size={14} /> Resumo</p>
        <h2 className="mt-3 text-xl font-black text-slate-900">Leitura rápida dos números</h2>
        <p className="mt-2 text-sm leading-6 text-slate-600">Os melhores e piores meses usam o histórico mensal salvo da carteira, respeitando a quantidade de cotas que existia em cada período.</p>
      </div>

      <div className="mt-5 grid grid-cols-2 gap-3">
        <DividendExtremeMetric label={`Maior mês (${currentYear})`} snapshot={currentBest} />
        <DividendExtremeMetric label={`Menor mês (${currentYear})`} snapshot={currentWorst} />
        <DividendExtremeMetric label="Maior da história" snapshot={historicalBest} />
        <DividendExtremeMetric label="Menor da história" snapshot={historicalWorst} />
      </div>

      <div className="mt-3 grid gap-3 md:grid-cols-2 xl:grid-cols-4">
        <LightMetric label={`Total registrado em ${currentYear}`} value={currentYearMonths.length ? formatCurrency(currentYearTotal) : "-"} />
        <LightMetric label={`Média mensal em ${currentYear}`} value={currentYearMonths.length ? formatCurrency(currentYearAverage) : "-"} />
        <LightMetric label="Maior pagador estimado hoje" value={insights.dividendHistory.topPayer ? `${insights.dividendHistory.topPayer.ticker}: ${formatCurrency(insights.dividendHistory.topPayer.value)}` : "-"} />
        <LightMetric label="Maior peso financeiro hoje" value={topWeight ? `${topWeight.ticker}: ${formatPercentValue(topWeightPercent)}` : "-"} />
      </div>
    </section>
  );
}'''

          pattern = r'function SimpleMonthlySummary\([\s\S]*?\n}\n\nfunction VisualHistorySection'
          text, count = re.subn(pattern, replacement + '\n\nfunction VisualHistorySection', text, count=1)
          if count != 1:
              raise SystemExit('SimpleMonthlySummary block not found')

          metric_component = r'''
function DividendExtremeMetric({ label, snapshot }: { label: string; snapshot: (WalletSnapshot & { income: number }) | null }) {
  const monthLabel = snapshot
    ? `${getSnapshotMonthLabel(snapshot)}/${getSnapshotYear(snapshot)}`
    : "-";

  return (
    <div className="min-w-0 rounded-2xl bg-slate-50 p-3 ring-1 ring-slate-200 sm:p-4">
      <p className="text-[11px] font-extrabold uppercase tracking-wide text-slate-500 sm:text-xs">{label}</p>
      <p className="mt-2 text-sm font-black text-slate-900 sm:text-base">{monthLabel}</p>
      <p className="mt-1 text-sm font-extrabold text-indigo-700 sm:text-base">{snapshot ? formatCurrency(snapshot.income) : "-"}</p>
    </div>
  );
}
'''

          marker = '\nfunction VisualHistorySection'
          text = text.replace(marker, metric_component + marker, 1)

          path.write_text(text)
          PY

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wallet-summary-history-fix.yml
          git add src/app/carteira/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Use saved history for dividend extremes"
          git push
